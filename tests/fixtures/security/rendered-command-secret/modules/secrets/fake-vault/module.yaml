# Fixture module for CDS-SEC-070 regression tests. Mirrors the shape of the
# real modules/secrets/vault/module.yaml bug fixed in PR #290: a secret
# alias passed through `${config.tokenFrom}` directly into a Compose
# "command:" list argument, where it becomes a "${CDS_*}" placeholder that
# docker compose substitutes into the container's argv (visible to any
# local user via /proc/<pid>/cmdline). Also covers a *bare* positional
# argument (no "--flag=" prefix) and a healthcheck probe, both of which
# leak the same way but previously slipped past CDS-SEC-070's narrower
# match conditions.
apiVersion: cds/v1alpha1
kind: Module
metadata:
  name: fake-vault
  category: secrets
  version: "0.1.0"
  productionSuitable: false
  displayName: Fixture-only fake secrets service
  description: >
    Test fixture module only. Not a real module; exists purely to exercise
    the rendered-compose security scan against command-line and
    healthcheck secret leaks.

spec:
  configSchema:
    type: object
    additionalProperties: false
    required:
      - tokenFrom
      - bareTokenFrom
    properties:
      tokenFrom:
        type: string
        pattern: "^secrets\\.[a-zA-Z0-9_-]+$"
      bareTokenFrom:
        type: string
        pattern: "^secrets\\.[a-zA-Z0-9_-]+$"

  implementation:
    kind: docker-compose
    compose:
      services:
        fake-vault:
          image: alpine:3.20
          command:
            - server
            - -dev
            - "-dev-root-token-id=${config.tokenFrom}"
            - "${config.bareTokenFrom}"
          healthcheck:
            test:
              - CMD-SHELL
              - "check-token ${config.tokenFrom}"
