# Fixture module for CDS-SEC-070 regression tests: the *fixed* shape from
# PR #290, where the secret is passed via an environment variable instead
# of a command-line argument. Used as a negative control to prove the
# rendered-compose scan does not flag the safe pattern.
apiVersion: cds/v1alpha1
kind: Module
metadata:
  name: fake-vault-safe
  category: secrets
  version: "0.1.0"
  productionSuitable: false
  displayName: Fixture-only fake secrets service (safe variant)
  description: >
    Test fixture module only. Not a real module; exists purely to prove
    CDS-SEC-070 does not flag a secret passed via environment instead of
    command-line arguments.

spec:
  configSchema:
    type: object
    additionalProperties: false
    required:
      - tokenFrom
    properties:
      tokenFrom:
        type: string
        pattern: "^secrets\\.[a-zA-Z0-9_-]+$"

  implementation:
    kind: docker-compose
    compose:
      services:
        fake-vault-safe:
          image: alpine:3.20
          command:
            - server
            - -dev
          environment:
            VAULT_DEV_ROOT_TOKEN_ID: "${config.tokenFrom}"
