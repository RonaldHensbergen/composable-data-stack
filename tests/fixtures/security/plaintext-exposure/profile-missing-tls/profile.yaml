# yaml-language-server: $schema=../../../../../cli/resources/profile.schema.json
apiVersion: cds/v1alpha1
kind: Profile
metadata:
  name: plaintext-exposure-missing-tls
  environment: production
spec:
  runtime:
    type: docker-compose
  modules:
    - id: api
      source: apps/plain-api
      version: "0.1.0"
      enabled: true
      config:
        publicPort: 8080
  secrets:
    values:
      backup_key:
        env: CDS_BACKUP_KEY
        required: false
  backup:
    encryption:
      keyFrom: secrets.backup_key
    policies:
      - workloadClass: configuration
        retentionDays: 30
        rpoMinutes: 1440
        rtoMinutes: 120
        restoreVerification:
          frequencyDays: 90
