# yaml-language-server: $schema=../../../../../cli/resources/profile.schema.json
apiVersion: cds/v1alpha1
kind: Profile
metadata:
  name: plaintext-exposure-waived
  environment: production
spec:
  runtime:
    type: docker-compose
  modules:
    - id: api
      source: apps/plain-api
      version: "0.1.0"
      enabled: true
      config:
        publicPort: 8080
  security:
    waivers:
      plaintextEndpointExposure:
        reason: approved waiver
