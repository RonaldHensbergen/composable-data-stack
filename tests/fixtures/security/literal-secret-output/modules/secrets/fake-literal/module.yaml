# Fixture module for CDS-SEC-006/030/071 regression tests (#356). Copies a
# free-form config string straight into the container environment, so a
# profile that pastes a real secret value into that config (instead of a
# secrets.<alias> reference) puts the literal value in the rendered output.
apiVersion: cds/v1alpha1
kind: Module
metadata:
  name: fake-literal
  category: secrets
  version: "0.1.0"
  productionSuitable: false
  displayName: Fixture-only literal passthrough service
  description: >
    Test fixture module only. Not a real module.

spec:
  runtime:
    type: container
    service:
      name: fake-literal
      ports: []
      networks:
        - default

  configSchema:
    type: object
    additionalProperties: false
    required:
      - setting
    properties:
      setting:
        type: string

  implementation:
    kind: docker-compose
    compose:
      services:
        fake-literal:
          image: alpine:3.20
          environment:
            SETTING: "${config.setting}"
