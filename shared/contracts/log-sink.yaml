# yaml-language-server: $schema=../../cli/resources/contract.schema.json
apiVersion: cds/v1alpha1
kind: Contract

metadata:
  name: log-sink
  category: shared
  version: "0.1.0"
  description: >-
    Shared, vendor-neutral contract describing the values a centralized log
    collector exposes so any module can ship structured events to it without
    the profile hardcoding a specific logging provider. Shaped so an
    OpenTelemetry Collector OTLP receiver or Loki's native OTLP endpoint can
    be a conforming provider (protocol "otlp-http" with an OTLP ingest path
    such as "/v1/logs" or "/otlp/v1/logs"), alongside plain-HTTP JSON
    collectors (issue #1076). See docs/observability.md for the tiered
    retention design this contract supports.

spec:
  fields:
    host:
      type: string
      required: true
      description: Hostname or service name clients use to ship events.
    port:
      type: integer
      required: true
      description: >-
        TCP port the collector listens on (OTLP/HTTP default 4318, Loki's
        native OTLP endpoint 3100). In-network port (issue #1067): consumers dial ${bindings.<name>.host}:${bindings.<name>.port} on the shared Compose network, where the provider listens on its container port (on Kubernetes the Service port is rendered equal to that container port). It is not the localhost host-published port: the 127.0.0.1:<port>:<containerPort> publish is a separate module config concern and must never be advertised here. Render-time cross-check (issue #1245): when the advertised host is a service the render produced, this port must equal one of that service's declared container ports, else the render fails closed with E164.
    protocol:
      type: string
      required: true
      description: >-
        Wire protocol expected by the collector, e.g. "otlp-http",
        "otlp-grpc", "http", "grpc", or "syslog".
    ingestPath:
      type: string
      required: false
      description: Optional path/endpoint suffix for HTTP-based collectors (e.g. a push API route).
    connectionUri:
      type: string
      required: false
      description: >-
        Fully composed base endpoint ("<scheme>://<host>:<port>") a client
        dials directly, mirroring the `connectionUri` field on
        `trace-sink`/`metrics-sink`/`sql-database`/`lineage-sink`. OTLP/HTTP
        forwarders (e.g. the `otel-collector` module's `backends.logs`) dial
        `connectionUri` + `ingestPath`, so providers that want their logs
        signal to be forwardable should advertise it (issue #1076). When its host is a service the render produced, the embedded port must equal one of that service's declared container ports, else the render fails closed with E164 (issue #1245).
    rawRetentionDays:
      type: integer
      required: false
      description: Short retention window the sink applies to raw, unstructured log lines.
    structuredRetentionDays:
      type: integer
      required: false
      description: Longer retention window the sink applies to structured, high-value events.
    serviceName:
      type: string
      required: false
      description: >-
        Compose service name (as written in the provider module's compose
        fragment) that serves the collector endpoint. Multi-service
        providers whose instance id does not resolve on the Compose network
        set this so the provided-contract host check (E150) can map it
        through the renderer's service-naming rule; `host` should then be
        built from `${service.services.<name>}` for the same service
        (issue #1029).
  examples:
    - host: loki-storage
      port: 3100
      protocol: otlp-http
      ingestPath: /otlp/v1/logs
      connectionUri: http://loki-storage:3100
      rawRetentionDays: 7
      structuredRetentionDays: 90
    - host: otel-collector
      port: 4318
      protocol: otlp-http
      ingestPath: /v1/logs
      connectionUri: http://otel-collector:4318
