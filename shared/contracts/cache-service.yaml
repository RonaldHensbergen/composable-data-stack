# yaml-language-server: $schema=../../cli/resources/contract.schema.json
apiVersion: cds/v1alpha1
kind: Contract

metadata:
  name: cache-service
  category: shared
  version: "0.1.0"
  description: Shared contract describing the values a cache service provider exposes (Redis-compatible).

spec:
  fields:
    host:
      type: string
      required: true
      description: Hostname or service name clients use to connect.
    port:
      type: integer
      required: true
      description: TCP port where the cache service listens.
    protocol:
      type: string
      required: true
      description: Protocol type (e.g., redis, memcached).
    password:
      type: string
      required: false
      description: Optional password for authentication.
    authentication:
      type: string
      required: false
      description: >-
        Whether the cache rejects unauthenticated clients: "required" when a
        password (or other credential check) is enforced, absent/empty when
        the service accepts unauthenticated connections. A production
        profile fails validation with E137 for a cache-service provider that
        does not advertise "required" (see issue #206).
    connectionUri:
      type: string
      required: true
      description: Connection URI for the cache service.
    tls:
      type: boolean
      required: false
      description: >-
        Whether the cache endpoint is TLS-protected. Optional for backward
        compatibility: an absent field means TLS is not advertised, and a
        consumer that declares "tls: required" on its consume entry fails
        validation with E128 unless the provider's contract spec sets this to
        true (see issue #577).
  examples:
    - host: keydb
      port: 6379
      protocol: redis
      password: ""
      connectionUri: redis://keydb:6379
    - host: keydb
      port: 6379
      protocol: redis
      password: ${CDS_CACHE_PASSWORD}
      authentication: required
      connectionUri: "redis://:${CDS_CACHE_PASSWORD}@keydb:6379"
