# yaml-language-server: $schema=../../cli/resources/contract.schema.json
apiVersion: cds/v1alpha1
kind: Contract

metadata:
  name: http-service
  category: shared
  version: "0.1.0"
  description: >-
    Shared contract describing an HTTP service a module exposes. Unlike
    sql-database/cache-service (whose fields are connection values a consumer
    binds via ${bindings.<name>.<field>}), these fields are provider-side
    service descriptors: they tell the stack where the HTTP endpoint lives
    and how it is served. The optional tls field carries the TLS
    advertisement consumers can require via a "tls: required" consume entry
    (see issue #577).

    A reverse-proxy module (one providing the reverse-proxy contract, e.g.
    Traefik) consumes this contract to build its routing table (issue #883):
    each of the proxy's route entries binds one http-service provide via
    `contractRef` (declared as a list-valued `consumes` entry with
    `mappedFrom: spec.config.routes`), and the proxy's routing configuration
    is generated from those resolved bindings -- host/port/serviceName here
    become the route's backend address -- instead of a hand-written static
    file. The optional pathPrefix field lets the provider advertise a
    default public path prefix for that route.

spec:
  fields:
    portFrom:
      type: string
      required: true
      description: >-
        Config path (e.g. spec.config.webPort) whose value is the TCP port
        the HTTP service listens on.
    host:
      type: string
      required: false
      description: >-
        Resolvable service hostname on the shared Compose network (the
        renderer's compose service name for single-service providers)
        that consumers such as the reverse-proxy route generator
        (issue #581) use as the backend address; absent means the
        provider does not advertise a directly reachable address. Route
        generation and the provided-contract host check (issue #1010)
        cross-check the resolved address against the compose services
        the render actually produced and fail with a diagnostic when
        nothing answers it.
    serviceName:
      type: string
      required: false
      description: >-
        Compose service name (as written in the module's compose fragment)
        that serves this endpoint. Required for multi-service modules whose
        serving service is not named after the instance id (e.g. dagster's
        webserver): route generation maps it through the renderer's
        service-naming rule (`<instance-id>-<service>` unless already
        prefixed) so the backend URL matches the name Docker Compose
        creates. Absent means the advertised `host` is used as-is.
    port:
      type: integer
      required: false
      description: >-
        Resolvable TCP port value (e.g. interpolated ${config.webPort}) that
        consumers such as the reverse-proxy route generator (issue #581) use
        as the backend port; absent means the provider does not advertise a
        directly reachable port and route generation fails with a
        diagnostic instead of guessing.
    healthPath:
      type: string
      required: false
      description: HTTP path serving a health-check endpoint (e.g. /health).
    pathPrefix:
      type: string
      required: false
      description: >-
        Optional default public path prefix a reverse-proxy route for this
        service matches (e.g. /auth), used when the proxy's route entry does
        not set its own pathPrefix (issue #883). Combined with a route host
        as Host(`<host>`) && PathPrefix(`/auth`).
    protocol:
      type: string
      required: false
      description: Scheme the service is served over (http or https).
    tls:
      type: boolean
      required: false
      description: >-
        Whether the HTTP endpoint is TLS-protected. Optional for backward
        compatibility: an absent field means TLS is not advertised, and a
        consumer that declares "tls: required" on its consume entry fails
        validation with E128 unless the provider's contract spec sets this to
        true.
  examples:
    - portFrom: spec.config.webPort
      healthPath: /health
      protocol: http
      tls: false
