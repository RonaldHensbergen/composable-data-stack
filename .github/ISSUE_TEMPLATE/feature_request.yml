name: Feature request
description: Suggest an improvement
labels:
- enhancement
body:
- type: markdown
  attributes:
    value: |
      Thanks for suggesting an improvement.

- type: input
  id: problem
  attributes:
    label: Problem statement
    description: What user problem does this solve?
    placeholder: I cannot reuse profile defaults across environments
  validations:
    required: true

- type: textarea
  id: proposal
  attributes:
    label: Proposed solution
    description: Describe what you want to happen
  validations:
    required: true

- type: textarea
  id: success-criteria
  attributes:
    label: Success criteria
    description: |
      How will we know this worked? Write the observable outcomes that prove
      the feature is done — the account you can give of what was built. Work
      does not start on a request without these.
    placeholder: |
      e.g. `cds validate profiles/x/profile.yaml` exits 0 and the rendered
      compose file contains the new service with the documented ports.
  validations:
    required: true

- type: textarea
  id: one-question
  attributes:
    label: The One Question
    description: What do we still need to learn before we can build this?
    placeholder: e.g. Whether the module needs a dedicated network or can share the default one
  validations:
    required: true

- type: textarea
  id: alternatives
  attributes:
    label: Alternatives considered
    description: Workarounds or alternative designs

- type: textarea
  id: impact
  attributes:
    label: Impact
    description: Affected users, modules, contracts, or workflows

- type: checkboxes
  id: checks
  attributes:
    label: Pre-submit checks
    options:
    - label: I searched existing issues and discussions
      required: true
