name: Mutation Tests (Kill Matrix)

# Every test must earn its place: mutmut runs the test suite against mutants
# of the contract/security core of the CLI (scoped in pyproject.toml
# [tool.mutmut]) and reports which mutants survived. A test that catches
# nothing of its own is redundant; a surviving mutant is a behavior no test
# pins. See CONTRIBUTING.md "How We Work" and `make test-mutation` locally.
#
# This workflow is informational, not a required check: surviving mutants
# mean missing or redundant tests, not broken code. The full kill matrix is
# published as a workflow artifact and job summary on every PR and weekly.

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "5 6 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-tests
  cancel-in-progress: false

jobs:
  kill-matrix:
    # Dependabot lock bumps get no analysis value here and no secrets, same
    # reasoning as the sonarcloud job in ci.yml (#970).
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so mutmut's git change detection has a baseline.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # mutmut is pinned ad hoc here (and in the Makefile test-mutation
          # target), not in uv.lock. The git pin points at the boxed/mutmut
          # main commit shipping the torn-.meta fix (boxed/mutmut#630, merged
          # 2026-11-07); flip it to "mutmut==<release>" once a mutmut release
          # > 3.8.1 is on PyPI (#1193).
          pip install -e ".[test]" "mutmut @ git+https://github.com/boxed/mutmut@6837b3c3ab0cfa4f5488f68adbd1bb26f68b8eb8" pytest

      - name: Run kill matrix
        run: |
          set +e
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # PR runs are time-capped: hosted runners have been observed to
            # receive a shutdown signal mid-run (~4 min into the job, killing
            # the step before a longer cap could fire and exit 124), so keep
            # the matrix bounded well below that window and accept a partial
            # result (exit 124 from timeout). Weekly schedule runs are
            # uncapped and produce the full matrix.
            timeout 180 python -m mutmut run
          else
            python -m mutmut run
          fi
          rc=$?
          set -e
          if [[ $rc -ne 0 && $rc -ne 124 ]]; then
            exit $rc
          fi
          if [[ $rc -eq 124 ]]; then
            echo "Kill matrix time-capped on PR run; publishing the partial matrix (weekly run completes the full one)."
          fi

      - name: Export stats, badge, and results
        run: |
          # A time-capped PR run (exit 124) can be killed mid-write, leaving an
          # empty or truncated mutants/*.meta cache file. mutmut's load() now
          # treats an unparseable cache like a missing one (catches
          # json.JSONDecodeError alongside FileNotFoundError, boxed/mutmut#630),
          # so export-cicd-stats tolerates a torn cache and no workflow-side
          # sanitizer is needed (#1175, #1193).
          python -m mutmut export-cicd-stats
          # When a time-capped run recorded no results at all, export-cicd-stats
          # writes no stats file, and badge requires an existing valid-JSON input,
          # so write an empty-stats placeholder to keep the badge and the job
          # summary rendering instead of failing the job (#1175).
          if ! python -c 'import json; json.load(open("mutants/mutmut-cicd-stats.json"))' 2>/dev/null; then
            mkdir -p mutants
            printf '%s\n' '{"killed": 0, "survived": 0, "total": 0, "no_tests": 0, "skipped": 0, "suspicious": 0, "timeout": 0, "check_was_interrupted_by_user": 0, "segfault": 0}' > mutants/mutmut-cicd-stats.json
            echo "::notice::No mutation results recorded (time-capped run); wrote empty-stats placeholder (#1175)."
          fi
          python -m mutmut badge --output "$RUNNER_TEMP/mutation-badge.svg" --label "mutation score"
          python -m mutmut results --all true > "$RUNNER_TEMP/mutmut-results.txt" || true
          cat "$RUNNER_TEMP/mutmut-results.txt" || true

      - name: Mutation score summary
        shell: bash
        run: |
          python - "$RUNNER_TEMP" <<'EOF'
          import json, sys
          from pathlib import Path
          temp = Path(sys.argv[1])
          stats_path = Path("mutants/mutmut-cicd-stats.json")
          lines = ["## Kill matrix (mutation testing)", ""]
          if stats_path.exists():
              stats = json.loads(stats_path.read_text(encoding="utf-8"))
              lines.append("```json")
              lines.append(json.dumps(stats, indent=2, sort_keys=True))
              lines.append("```")
          else:
              lines.append("_No stats exported._")
          summary = Path(temp / "summary.md")
          summary.write_text("\n".join(lines) + "\n", encoding="utf-8")
          with open(summary, "a", encoding="utf-8") as fh:
              fh.write("\nFull per-mutant results: workflow artifact `mutmut-kill-matrix`.\n")
          import os
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as gh:
              gh.write(summary.read_text(encoding="utf-8"))
          EOF

      - name: Upload kill matrix report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mutmut-kill-matrix
          path: |
            mutants/mutmut-cicd-stats.json
            mutants/mutants.log
            ${{ runner.temp }}/mutation-badge.svg
            ${{ runner.temp }}/mutmut-results.txt
          if-no-files-found: warn
