name: Issue Project Order

# Assigns the next free `Order` value in the "Composable Data Stack Roadmap"
# project (project 1, owner RonaldHensbergen) to every newly opened issue:
# the issue is added to the project when it is not an item yet, then its
# `Order` is set to max(existing orders) + 1, so new issues append at the end
# of the board and existing items are never reordered (see AGENT.md,
# "Project `Order` tiers"). Items that already have an `Order` are left
# untouched, which also makes manual re-runs via workflow_dispatch safe.
#
# GITHUB_TOKEN is repository-scoped and cannot access GitHub Projects, so
# this workflow authenticates with a personal access token stored in the
# `PROJECTS_TOKEN` repository secret. The roadmap project is user-owned, and
# fine-grained PATs have no account-level Projects permission, so use a
# classic PAT with the `project` scope (read/write for Projects v2) plus
# `public_repo` (this repository is public) to resolve issue URLs.

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to assign an order to (defaults to the event issue)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: issue-project-order
  cancel-in-progress: false

jobs:
  assign-order:
    # Bot-opened issues (audit reports etc.) stay out of the roadmap project.
    if: github.event.issue.user.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    env:
      GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
      PROJECT_OWNER: RonaldHensbergen
      PROJECT_NUMBER: "1"
      ORDER_FIELD: Order
      STATUS_FIELD: Status
      STATUS_TODO: Todo
    steps:
      - name: Resolve issue
        id: issue
        env:
          EVENT_NUMBER: ${{ github.event.issue.number }}
          INPUT_NUMBER: ${{ inputs.issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          number="${INPUT_NUMBER:-${EVENT_NUMBER}}"
          if [[ -z "${number}" ]]; then
            echo "No issue number available; nothing to do."
            exit 0
          fi
          if [[ ! "${number}" =~ ^[0-9]+$ ]]; then
            echo "Invalid issue number '${number}'; expected a positive integer." >&2
            exit 1
          fi
          echo "number=${number}" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/${GITHUB_REPOSITORY}/issues/${number}" >> "$GITHUB_OUTPUT"

      - name: Add issue to project and assign next order
        if: steps.issue.outputs.number != ''
        shell: bash
        run: |
          set -euo pipefail
          number="${{ steps.issue.outputs.number }}"
          url="${{ steps.issue.outputs.url }}"

          items="$(gh project item-list "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --limit 1000 --format json)"

          existing_order="$(jq -r --argjson n "${number}" \
            '[.items[] | select((.content.number // 0) == $n and (.content.type // "") == "Issue") | .order // empty] | first // ""' \
            <<<"${items}")"

          if [[ -n "${existing_order}" ]]; then
            echo "Issue #${number} already has Order=${existing_order}; leaving existing items untouched."
            exit 0
          fi

          if ! jq -e --argjson n "${number}" \
            '.items[] | select((.content.number // 0) == $n and (.content.type // "") == "Issue")' \
            <<<"${items}" > /dev/null; then
            gh project item-add "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --url "${url}"
            # One field per item-edit invocation; new items also get the
            # board's default Status so they don't show up blank.
            gh project item-edit "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" \
              --url "${url}" --field "$STATUS_FIELD" --value "$STATUS_TODO"
            echo "Added issue #${number} to project ${PROJECT_NUMBER} with Status=${STATUS_TODO}."
          fi

          max="$(jq '[.items[].order // empty] | max // 0' <<<"${items}")"
          next=$((max + 1))

          gh project item-edit "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" \
            --url "${url}" --field "$ORDER_FIELD" --value "${next}"
          echo "Assigned Order=${next} to issue #${number} (previous max: ${max})."
