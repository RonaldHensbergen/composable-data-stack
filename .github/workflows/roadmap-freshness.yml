name: Biweekly Roadmap Freshness Check

on:
  schedule:
    - cron: "23 7 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: biweekly-roadmap-freshness
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    outputs:
      should_run: ${{ steps.cadence.outputs.run }}
    steps:
      - name: Check biweekly cadence
        id: cadence
        shell: bash
        run: |
          week="$(date -u +%V)"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] \
            || ((10#"$week" % 2 == 0)); then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping odd ISO week $week."
          fi

      - name: Checkout
        if: steps.cadence.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run roadmap freshness check
        if: steps.cadence.outputs.run == 'true'
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          python3 scripts/check_roadmap_freshness.py > "$RUNNER_TEMP/roadmap-check.txt" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/roadmap-check.txt"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: File or update freshness report
        if: steps.cadence.outputs.run == 'true' && steps.check.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh label create roadmap-audit \
            --repo "$GITHUB_REPOSITORY" \
            --color "1d76db" \
            --description "docs/roadmap.md drifted from actual issue/PR state" \
            --force

          title="docs/roadmap.md freshness check found stale entries"
          report="$RUNNER_TEMP/roadmap-freshness-report.md"
          {
            printf '<!-- roadmap-freshness-check -->\n'
            printf 'Generated by [%s](%s/actions/runs/%s) from `scripts/check_roadmap_freshness.py`.\n\n' \
              "$GITHUB_WORKFLOW" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf '```\n'
            cat "$RUNNER_TEMP/roadmap-check.txt"
            printf '```\n'
          } > "$report"

          existing="$(
            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --label roadmap-audit \
              --limit 10 \
              --json number,title \
              --jq ".[] | select(.title == \"$title\") | .number" \
              | head -n 1
          )"

          if [[ -n "$existing" ]]; then
            gh issue edit "$existing" \
              --repo "$GITHUB_REPOSITORY" \
              --body-file "$report"
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --label roadmap-audit \
              --body-file "$report"
          fi

      - name: Close stale report if roadmap is fresh again
        if: steps.cadence.outputs.run == 'true' && steps.check.outputs.status == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          existing="$(
            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --label roadmap-audit \
              --limit 10 \
              --json number \
              --jq '.[0].number'
          )"
          if [[ -n "$existing" && "$existing" != "null" ]]; then
            gh issue close "$existing" \
              --repo "$GITHUB_REPOSITORY" \
              --comment "docs/roadmap.md is consistent with current issue/PR state and version as of this biweekly check."
          fi
