name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/build-python-package.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Verify tag matches pyproject.toml version
        run: |
          python -m pip install --upgrade pip packaging
          python scripts/check_release_version.py "${GITHUB_REF_NAME}"

      - name: Extract changelog section for this tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          if [ ! -f CHANGELOG.md ]; then
            echo "_CHANGELOG.md not found. See the commit comparison below._" > release_notes.md
            exit 0
          fi

          ESCAPED_VERSION=$(printf '%s' "$VERSION" | sed 's/\./\\./g')

          awk -v ver="$ESCAPED_VERSION" '
            BEGIN { found=0 }
            /^## \[/ {
              if (found) exit
              if ($0 ~ "\\[" ver "\\]") { found=1; next }
              next
            }
            found { print }
          ' CHANGELOG.md > release_notes.md 2>/dev/null

          if [ ! -s release_notes.md ]; then
            echo "_No CHANGELOG.md entry found for ${GITHUB_REF_NAME}. See the commit comparison below._" > release_notes.md
          fi

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Download CLI SBOM and release artifact inventory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-package-release-evidence
          path: release-evidence/
      - name: Append support notice
        run: |
          printf '\n' >> release_notes.md
          python scripts/render_support_notice.py "${GITHUB_REF_NAME}" >> release_notes.md

      - name: Verify release notes include a support notice
        run: python scripts/check_release_notes_support.py release_notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          body_path: release_notes.md
          generate_release_notes: true
          draft: true
          # SBOM and release-inventory are attached as permanent release
          # assets, not just short-retention CI artifacts (see
          # RELEASE.md#release-evidence), since the CI artifacts the build
          # job produces expire long before this evidence is needed. The
          # dist/ files themselves are not attached here: PyPI (pypi.yml)
          # remains the authoritative distribution channel for them.
          files: |
            release-evidence/cli-sbom.cyclonedx.json
            release-evidence/release-inventory.json

      - name: Verify the release was published, not left as a draft
        # softprops/action-gh-release@v3 has consistently published the
        # release outright (not left it in draft state) for every tag this
        # repo has pushed so far, despite `draft: true` above -- this is
        # believed to be a quirk of the action reusing/finalizing the
        # release record for an existing tag rather than intentional
        # behavior we can rely on long-term. Fail loudly instead of
        # silently leaving an unpublished draft if that ever changes, since
        # PyPI publishing in pypi.yml is a separate, independent workflow
        # and does not depend on this GitHub release existing/being public.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          is_draft="$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq .isDraft)"
          if [ "${is_draft}" = "true" ]; then
            echo "::error::Release ${GITHUB_REF_NAME} was created as a draft and needs to be published manually: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
            exit 1
          fi
          echo "OK: release ${GITHUB_REF_NAME} is published."
