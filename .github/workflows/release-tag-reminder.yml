name: Release Tag Reminder

# Catches the exact gap that let v0.5.2 sit merged-to-main for ~10 hours
# without ever being tagged/released: a `chore(release): bump version to
# X.Y.Z` PR merges (version-bump.yml deliberately stops there and never
# tags), and nobody remembers to `git tag vX.Y.Z && git push --tags`
# afterwards. This workflow does not tag or release anything itself -- it
# only opens/updates a single tracking issue so the gap is visible instead
# of silent.
on:
  push:
    branches: [main]
  schedule:
    # Daily backstop in case the triggering push event is missed/delayed,
    # or the gap persists across multiple days.
    - cron: "43 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-tag-reminder
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Compare pyproject.toml version against existing tags
        id: check
        run: |
          set -euo pipefail
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          tag="v${version}"

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "untagged=false" >> "$GITHUB_OUTPUT"
          else
            echo "untagged=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Open or update reminder issue
        if: steps.check.outputs.untagged == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.check.outputs.version }}
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          set -euo pipefail
          title="Release ${TAG} is untagged on main"
          body="\`pyproject.toml\` on \`main\` declares version \`${VERSION}\`, but no \`${TAG}\` git tag exists yet, so \`release.yml\`/\`pypi.yml\` never ran for it.

          To finish the release:
          1. Confirm \`CHANGELOG.md\` has a dated \`## [${VERSION}] - YYYY-MM-DD\` section (not just \`[Unreleased]\`).
          2. Tag the current \`main\` HEAD and push it:
             \`\`\`
             git tag ${TAG}
             git push origin ${TAG}
             \`\`\`
          3. Confirm the \`Release\` and \`Publish CLI to PyPI\` workflow runs both succeed for the new tag.

          This issue was opened automatically by \`.github/workflows/release-tag-reminder.yml\` and will auto-close the next time this check runs after ${TAG} exists."

          existing="$(gh issue list --search "in:title \"${title}\"" --state open --json number,title \
            --jq ".[] | select(.title == \"${title}\") | .number" | head -n1)"

          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "Still untagged as of this check."
          else
            gh issue create --title "${title}" --body "${body}" --label "release"
          fi

      - name: Close stale reminder issues
        if: steps.check.outputs.untagged == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for number in $(gh issue list --search "in:title \"is untagged on main\"" --state open --json number --jq '.[].number'); do
            gh issue comment "${number}" --body "Resolved: the release version on \`main\` now has a matching tag."
            gh issue close "${number}"
          done
