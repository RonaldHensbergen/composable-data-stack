name: Biweekly Issue Consistency Audit

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: biweekly-issue-consistency-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      models: read
    outputs:
      should_run: ${{ steps.cadence.outputs.run }}
    steps:
      - name: Check biweekly cadence
        id: cadence
        shell: bash
        run: |
          week="$(date -u +%V)"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] \
            || ((10#"$week" % 2 == 0)); then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping odd ISO week $week."
          fi

      - name: Checkout
        if: steps.cadence.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 100

      - name: Collect audit context
        if: steps.cadence.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "-label:issue-audit" \
            --limit 200 \
            --json number,title,body,labels,milestone,createdAt,updatedAt,url \
            > "$RUNNER_TEMP/open-issues.json"
          git log \
            --since="90 days ago" \
            --max-count=100 \
            --format="%h %ad %s" \
            --date=short \
            > "$RUNNER_TEMP/recent-commits.txt"

      - name: Audit issue consistency
        if: steps.cadence.outputs.run == 'true'
        id: inference
        uses: actions/ai-inference@v1
        with:
          prompt-file: .github/prompts/issue-consistency-audit.prompt.yml
          file_input: |
            issues: ${{ runner.temp }}/open-issues.json
            recent_commits: ${{ runner.temp }}/recent-commits.txt

      - name: Preserve audit report
        if: steps.cadence.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: issue-consistency-audit
          path: ${{ steps.inference.outputs.response-file }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: audit
    if: needs.audit.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Download audit report
        uses: actions/download-artifact@v7
        with:
          name: issue-consistency-audit
          path: ${{ runner.temp }}/issue-consistency-audit

      - name: Publish review report
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          RESPONSE_FILE="$(
            find "$RUNNER_TEMP/issue-consistency-audit" -type f -print -quit
          )"
          test -s "$RESPONSE_FILE"

          audit_date="$(date -u +%F)"
          title="Biweekly issue consistency audit - $audit_date"
          report="$RUNNER_TEMP/issue-audit-report.md"
          {
            printf '<!-- issue-consistency-audit -->\n'
            printf 'Generated by [%s](%s/actions/runs/%s). Review findings before editing or closing issues.\n\n' \
              "$GITHUB_WORKFLOW" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            cat "$RESPONSE_FILE"
          } > "$report"

          gh label create issue-audit \
            --repo "$GITHUB_REPOSITORY" \
            --color "5319E7" \
            --description "Automated issue consistency audit report" \
            --force

          existing="$(
            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state all \
              --label issue-audit \
              --limit 100 \
              --json number,title \
              --jq ".[] | select(.title == \"$title\") | .number" \
              | head -n 1
          )"

          if [[ -n "$existing" ]]; then
            gh issue edit "$existing" \
              --repo "$GITHUB_REPOSITORY" \
              --body-file "$report"
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --label issue-audit \
              --body-file "$report"
          fi
