name: Contract Coverage

# Publishes how much of the system the Contract covers with executable tests
# (docs/contract-coverage.md, generated by scripts/check_contract_coverage.py).
#
# On PRs and pushes to main the committed report must be up to date (--check);
# run `make contract-coverage` locally and commit the result when a change
# adds or removes modules, profiles, shared contracts, or the tests that name
# them. On the weekly cadence a drift report is filed as an issue so the
# published number never silently rots.

on:
  push:
    branches: [main]
    paths:
      - "modules/**"
      - "modules-experimental/**"
      - "profiles/**"
      - "shared/contracts/**"
      - "tests/**"
      - "scripts/check_contract_coverage.py"
      - "docs/contract-coverage.md"
      - ".github/workflows/contract-coverage.yml"
  pull_request:
    branches: [main]
    paths:
      - "modules/**"
      - "modules-experimental/**"
      - "profiles/**"
      - "shared/contracts/**"
      - "tests/**"
      - "scripts/check_contract_coverage.py"
      - "docs/contract-coverage.md"
      - ".github/workflows/contract-coverage.yml"
  schedule:
    - cron: "41 6 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-coverage
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Fail if the committed report is stale
        if: github.event_name != 'schedule'
        run: |
          python scripts/check_contract_coverage.py --check

      - name: Regenerate report for drift detection
        if: github.event_name == 'schedule'
        run: |
          python scripts/check_contract_coverage.py

      - name: File or update weekly drift report
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          if git diff --quiet -- docs/contract-coverage.md; then
            echo "docs/contract-coverage.md is up to date; nothing to report."
            exit 0
          fi

          gh label create contract-coverage \
            --repo "$GITHUB_REPOSITORY" \
            --color "0e8a16" \
            --description "contract coverage report drifted; regenerate with make contract-coverage" \
            --force

          title="Contract coverage report is stale"
          report="$RUNNER_TEMP/contract-coverage-issue.md"
          {
            printf '<!-- contract-coverage-check -->\n'
            printf 'Generated by [%s](%s/actions/runs/%s) from `scripts/check_contract_coverage.py`.\n\n' \
              "$GITHUB_WORKFLOW" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'The committed `docs/contract-coverage.md` no longer matches the modules, profiles, shared contracts, and tests in the repo. Regenerate with `make contract-coverage` and commit the result.\n\n'
            printf '```diff\n'
            git diff -- docs/contract-coverage.md || true
            printf '```\n'
          } > "$report"

          existing="$(
            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --label contract-coverage \
              --limit 10 \
              --json number,title \
              --jq ".[] | select(.title == \"$title\") | .number" \
              | head -n 1
          )"

          if [[ -n "$existing" ]]; then
            gh issue edit "$existing" \
              --repo "$GITHUB_REPOSITORY" \
              --body-file "$report"
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --label contract-coverage \
              --body-file "$report"
          fi
