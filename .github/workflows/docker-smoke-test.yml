name: Docker Runtime Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build all Dockerfiles
        run: |
          for dockerfile in $(find . -name "Dockerfile*" -type f); do
            dir=$(dirname "$dockerfile")
            echo "Building $dockerfile in directory $dir..."
            context="$dir"
            if [ "$dockerfile" = "./images/dagster/Dockerfile" ] || [ "$dockerfile" = "./images/dagster/Dockerfile.user-code" ] || [ "$dockerfile" = "./images/superset/Dockerfile" ]; then
              context="."
            fi
            docker build -f "$dockerfile" "$context" || exit 1
          done

  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run Docker Compose smoke test (render -> build -> up -> down)
        env:
          CDS_RUN_DOCKER_SMOKE: "1"
        run: |
          python -m unittest tests.test_compose_runtime_smoke -v

      - name: Ensure Docker Compose cleanup runs even on failure
        if: always()
        run: |
          if [ -f docker-compose.yml ]; then
            docker compose -f docker-compose.yml down -v --remove-orphans || true
          fi
