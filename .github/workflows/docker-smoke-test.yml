name: Docker Runtime Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build all Dockerfiles
        run: |
          for dockerfile in $(find . -name "Dockerfile*" -type f); do
            dir=$(dirname "$dockerfile")
            echo "Building $dockerfile in directory $dir..."
            context="$dir"
            case "$dockerfile" in
              ./images/dagster/*|./images/superset/*|./images/dbt/*) context="." ;;
            esac
            docker build -f "$dockerfile" "$context" || exit 1
          done

  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Run Docker Compose smoke test (render -> build -> up -> down)
        env:
          CDS_RUN_DOCKER_SMOKE: "1"
        run: |
          python -m unittest tests.test_compose_runtime_smoke -v

      - name: Ensure Docker Compose cleanup runs even on failure
        if: always()
        run: |
          if [ -f docker-compose.yml ]; then
            docker compose -f docker-compose.yml down -v --remove-orphans || true
          fi
