name: Daily Branch Hygiene

# Daily audit of branches that carry no meaningful changes anymore — work
# already merged into main, in the same or an evolved form — so stale
# branches can be deleted. Runs scripts/check_branch_hygiene.py over all
# remote branches and files the report as an issue labeled `branch-hygiene`
# (closed again when nothing is stale). The workflow only sees remote refs;
# run `make branch-hygiene` locally to also audit local branches and
# worktrees. The script only reports; it never deletes anything.

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-branch-hygiene
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history and all branches: classification needs git cherry
          # against origin/main.
          fetch-depth: 0

      - name: Fetch all remote branches
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Run branch hygiene audit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python scripts/check_branch_hygiene.py --no-fetch > "$RUNNER_TEMP/branch-hygiene.md"
          cat "$RUNNER_TEMP/branch-hygiene.md"

      - name: File, update, or close the hygiene report issue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          report="$RUNNER_TEMP/branch-hygiene.md"
          title="Daily branch hygiene report"
          existing="$(
            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --label branch-hygiene \
              --limit 10 \
              --json number,title \
              --jq ".[] | select(.title == \"$title\") | .number" \
              | head -n 1
          )"

          if grep -qE "^STALE_BRANCHES: [1-9]" "$report"; then
            gh label create branch-hygiene \
              --repo "$GITHUB_REPOSITORY" \
              --color "d73a4a" \
              --description "Branches whose work is fully merged into main; safe to delete" \
              --force

            body="$RUNNER_TEMP/branch-hygiene-issue.md"
            {
              printf '<!-- branch-hygiene -->\n'
              printf 'Generated by [%s](%s/actions/runs/%s) from `scripts/check_branch_hygiene.py`.\n\n' \
                "$GITHUB_WORKFLOW" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
              cat "$report"
            } > "$body"

            if [[ -n "$existing" ]]; then
              gh issue edit "$existing" \
                --repo "$GITHUB_REPOSITORY" \
                --body-file "$body"
            else
              gh issue create \
                --repo "$GITHUB_REPOSITORY" \
                --title "$title" \
                --label branch-hygiene \
                --body-file "$body"
            fi
          elif [[ -n "$existing" ]]; then
            gh issue close "$existing" \
              --repo "$GITHUB_REPOSITORY" \
              --comment "No stale branches: every branch is either an ancestor of main, patch-equivalent to main, an active PR branch, or open work. Latest daily run: $(date -u +%Y-%m-%d)."
          else
            echo "Nothing stale and no open report issue; nothing to do."
          fi
