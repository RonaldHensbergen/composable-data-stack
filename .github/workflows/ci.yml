name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev] yamllint==1.38.0

      - name: Run Markdown lint
        run: |
          npx --yes markdownlint-cli@0.49.0 "**/*.md" ".github/**/*.md"

      - name: Run YAML lint
        run: |
          yamllint .

      - name: Run Python deprecation lint
        run: |
          ruff check .

      - name: Validate Renovate config
        run: |
          npx --yes --package renovate@44.65.5 -- renovate-config-validator --strict renovate.json

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[completion]

      - name: Run tests
        if: matrix.os != 'ubuntu-latest'
        run: |
          python scripts/run_tests_with_deprecation_gate.py

      - name: Run tests with coverage gate (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          pip install .[dev]
          coverage run scripts/run_tests_with_deprecation_gate.py
          coverage report -m
          coverage xml

      - name: Upload coverage report (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-xml
          path: coverage.xml

  sonarcloud:
    needs: test
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so SonarCloud can attribute issues/coverage to blame data.
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Build and check distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine pipx
          python -m build
          python -m twine check dist/*

      - name: Smoke test installed wheel
        run: |
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          export PIPX_BIN_DIR="$RUNNER_TEMP/pipx-bin"
          python -m pipx install "$wheel"
          cd "$RUNNER_TEMP"
          "$PIPX_BIN_DIR/cds" --help
          "$PIPX_BIN_DIR/cds" validate \
            "$GITHUB_WORKSPACE/profiles/local-dagster-postgres-superset/profile.yaml"
          set +e
          security_output="$(
            "$PIPX_BIN_DIR/cds" security \
              "$GITHUB_WORKSPACE/profiles/local-dagster-postgres-superset/profile.yaml" \
              2>&1
          )"
          security_status=$?
          set -e
          test "$security_status" -eq 0 || test "$security_status" -eq 1
          grep -Eq "No security findings|CDS-SEC-" <<<"$security_output"

      - name: Smoke test image verification on installed wheel
        env:
          CDS_ANALYTICS_DB_NAME: analytics
          CDS_ANALYTICS_DB_PASSWORD: analytics_testpass
          CDS_ANALYTICS_DB_USER: analytics
          CDS_DAGSTER_DB_NAME: dagster
          CDS_DAGSTER_DB_PASSWORD: dagster_testpass
          CDS_DAGSTER_DB_USER: dagster
          CDS_POSTGRES_SUPERUSER_PASSWORD: postgres_testpass
          CDS_SUPERSET_ADMIN_PASSWORD: admin_testpass
          CDS_SUPERSET_DB_NAME: superset
          CDS_SUPERSET_DB_PASSWORD: superset_testpass
          CDS_SUPERSET_DB_USER: superset
          CDS_SUPERSET_SECRET_KEY: ci-only-superset-secret-key
        run: |
          export PIPX_BIN_DIR="$RUNNER_TEMP/pipx-bin"
          set +e
          verify_output="$(
            "$PIPX_BIN_DIR/cds" security \
              "$GITHUB_WORKSPACE/profiles/local-dagster-postgres-superset/profile.yaml" \
              --verify-images 2>&1
          )"
          verify_status=$?
          set -e
          test "$verify_status" -eq 1
          grep -Eq "CDS-VER-001" <<<"$verify_output"

  cds-test:
    name: CDS Test (Stable Profile)
    runs-on: ubuntu-latest
    env:
      CDS_ANALYTICS_DB_NAME: analytics
      CDS_ANALYTICS_DB_PASSWORD: analytics_testpass
      CDS_ANALYTICS_DB_USER: analytics
      CDS_DAGSTER_DB_NAME: dagster
      CDS_DAGSTER_DB_PASSWORD: dagster_testpass
      CDS_DAGSTER_DB_USER: dagster
      CDS_POSTGRES_SUPERUSER_PASSWORD: postgres_testpass
      CDS_SUPERSET_ADMIN_PASSWORD: admin_testpass
      CDS_SUPERSET_DB_NAME: superset
      CDS_SUPERSET_DB_PASSWORD: superset_testpass
      CDS_SUPERSET_DB_USER: superset
      CDS_SUPERSET_SECRET_KEY: ci-only-superset-secret-key
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run end-to-end smoke test
        run: |
          # This profile intentionally has HIGH security findings against it
          # in CI (env-derived DB passwords look like hardcoded secrets to
          # CDS-SEC-001/003/041, and cosign is not installed on this runner,
          # so CDS-VER-001 also fires) — the same reason the "Verify
          # unverifiable images fail closed" step below expects `cds
          # security` to exit 1. `cds test` bundles security into its single
          # exit code, so assert only that validate/plan/render passed and
          # that the sole failing stage is "security", rather than requiring
          # the whole command to exit 0.
          set +e
          test_output="$(cds test local-dagster-postgres-superset 2>&1)"
          test_status=$?
          set -e
          echo "$test_output"
          grep -Eq "^\[PASS\] validate$" <<<"$test_output"
          grep -Eq "^\[FAIL\] security$" <<<"$test_output"
          grep -Eq "^\[PASS\] plan$" <<<"$test_output"
          grep -Eq "^\[PASS\] render$" <<<"$test_output"
          test "$test_status" -eq 1

      - name: Generate MVP plan
        run: cds plan local-dagster-postgres-superset --output /tmp/plan.json

      - name: Render MVP profile deterministically
        run: |
          cds render local-dagster-postgres-superset --output /tmp/docker-compose.first.yml
          cds render local-dagster-postgres-superset --output /tmp/docker-compose.second.yml
          cmp /tmp/docker-compose.first.yml /tmp/docker-compose.second.yml
          docker compose -f /tmp/docker-compose.first.yml config --quiet

      - name: Verify unverifiable images fail closed
        run: |
          set +e
          verify_output="$(cds security local-dagster-postgres-superset --verify-images 2>&1)"
          verify_status=$?
          set -e
          test "$verify_status" -eq 1
          grep -Eq "CDS-VER-" <<<"$verify_output"

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run bandit (SAST)
        run: |
          bandit -r cli/ shared/ images/ workdirs/

      - name: Run pip-audit (dependency CVEs)
        run: |
          python -c "import tomllib; d = tomllib.load(open('pyproject.toml', 'rb')); print('\n'.join(d['project']['dependencies']))" > /tmp/runtime-deps.txt
          cat images/dagster/requirements.txt >> /tmp/runtime-deps.txt
          cat images/dagster/requirements-postgres.txt >> /tmp/runtime-deps.txt
          pip-audit -r /tmp/runtime-deps.txt
