name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Lint stays Linux-only: markdownlint and yamllint check file content, not
  # OS-dependent code paths, so running them on three OSes would triple CI
  # cost for zero extra signal.
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install YAML linter
        run: |
          python -m pip install --upgrade pip
          pip install yamllint

      - name: Run Markdown lint
        run: |
          npx --yes markdownlint-cli@0.49.0 "**/*.md" ".github/**/*.md"

      - name: Run YAML lint
        run: |
          yamllint .

  # Core Python checks run on all three host OSes. This exercises unit tests
  # plus real `cds validate/plan/render` subprocess calls (see
  # tests/test_cds_workflow.py), catching cross-platform regressions in the
  # CLI itself, not just on Linux.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      # Coverage is measured and gated once, on Linux, not per-OS: the same
      # test suite runs identical Python on all three OSes, so coverage %
      # wouldn't meaningfully differ, and running it three times would just
      # triple CI cost for the same signal (same tradeoff as the lint job
      # above). fail_under and source scoping are configured in
      # pyproject.toml under [tool.coverage.*].
      - name: Run tests
        if: matrix.os != 'ubuntu-latest'
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run tests with coverage gate (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          pip install .[dev]
          coverage run -m unittest discover -s tests -p "test_*.py" -v
          coverage report -m

  profile-compile:
    runs-on: ubuntu-latest
    env:
      CDS_ANALYTICS_DB_NAME: analytics
      CDS_ANALYTICS_DB_PASSWORD: analytics_testpass
      CDS_ANALYTICS_DB_USER: analytics
      CDS_DAGSTER_DB_NAME: dagster
      CDS_DAGSTER_DB_PASSWORD: dagster_testpass
      CDS_DAGSTER_DB_USER: dagster
      CDS_POSTGRES_SUPERUSER_PASSWORD: postgres_testpass
      CDS_SUPERSET_ADMIN_PASSWORD: admin_testpass
      CDS_SUPERSET_DB_NAME: superset
      CDS_SUPERSET_DB_PASSWORD: superset_testpass
      CDS_SUPERSET_DB_USER: superset
      CDS_SUPERSET_SECRET_KEY: ci-only-superset-secret-key
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Validate MVP profile and modules
        run: cds validate local-dagster-postgres-superset

      - name: Generate MVP plan
        run: cds plan local-dagster-postgres-superset --output /tmp/plan.json

      - name: Render MVP profile deterministically
        run: |
          cds render local-dagster-postgres-superset --output /tmp/docker-compose.first.yml
          cds render local-dagster-postgres-superset --output /tmp/docker-compose.second.yml
          cmp /tmp/docker-compose.first.yml /tmp/docker-compose.second.yml
          docker compose -f /tmp/docker-compose.first.yml config --quiet

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run bandit (SAST)
        run: |
          bandit -r cli/ security/ shared/ images/ workdirs/

      - name: Run pip-audit (dependency CVEs)
        run: |
          python -c "import tomllib; d = tomllib.load(open('pyproject.toml', 'rb')); print('\n'.join(d['project']['dependencies']))" > /tmp/runtime-deps.txt
          cat images/dagster/requirements.txt >> /tmp/runtime-deps.txt
          cat images/dagster/requirements-postgres.txt >> /tmp/runtime-deps.txt
          pip-audit -r /tmp/runtime-deps.txt
