name: Publish Signed Images

on:
  schedule:
    # Weekly rebuild so base layers (OS packages, pip ranges) are refreshed
    # even when nothing changed in the repo; republishing keeps the signed
    # images up to date with the latest patches.
    - cron: "17 4 * * 1"
  push:
    branches: [main]
    paths:
      - "images/**"
      - ".github/workflows/publish-images.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover-images:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.find.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - id: find
        run: |
          images_json=$(python3 - <<'PY'
          import json
          import pathlib

          root = pathlib.Path("images")
          items = []
          for entry in sorted(root.iterdir()) if root.is_dir() else []:
              if not entry.is_dir():
                  continue
              # Flat layout: images/<name>/Dockerfile
              dockerfile = entry / "Dockerfile"
              if dockerfile.is_file():
                  items.append({"name": entry.name, "dockerfile": str(dockerfile)})
                  continue
              # Nested layout: images/<name>/base/Dockerfile
              nested_dockerfile = entry / "base" / "Dockerfile"
              if nested_dockerfile.is_file():
                  items.append({"name": entry.name, "dockerfile": str(nested_dockerfile)})
          print(json.dumps(items))
          PY
          )
          echo "images=$images_json" >> "$GITHUB_OUTPUT"

  publish:
    needs: discover-images
    if: needs.discover-images.outputs.images != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.discover-images.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Lowercase image name
        id: name
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "ref=${{ env.REGISTRY }}/${owner}/cds-${{ matrix.image.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build and push
        id: build
        run: |
          dockerfile="${{ matrix.image.dockerfile }}"
          context="$(dirname "$dockerfile")"
          case "$dockerfile" in
            images/dagster/*|images/superset/*) context="." ;;
          esac
          ref="${{ steps.name.outputs.ref }}"
          docker build -f "$dockerfile" -t "$ref:sha-${GITHUB_SHA::12}" -t "$ref:latest" "$context"
          docker push "$ref:sha-${GITHUB_SHA::12}"
          docker push "$ref:latest"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$ref:sha-${GITHUB_SHA::12}")"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Sign image (keyless)
        run: cosign sign --yes "${{ steps.build.outputs.digest }}"

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # trivy-action v0.36.0 defaults to Trivy CLI v0.70.0, not the
          # latest release; pin the CLI version explicitly so it is a
          # visible, Renovate-trackable dependency instead of a value
          # hidden inside the action's own action.yaml default.
          version: v0.73.0
          image-ref: ${{ steps.build.outputs.digest }}
          format: cyclonedx
          output: sbom.json

      - name: Attest SBOM
        run: cosign attest --yes --predicate sbom.json --type cyclonedx "${{ steps.build.outputs.digest }}"

      - name: Write provenance predicate
        run: |
          cat > provenance.json <<EOF
          {
            "builder": { "id": "https://github.com/actions/runner" },
            "buildType": "https://github.com/${{ github.repository }}/publish-images@v1",
            "invocation": {
              "configSource": {
                "uri": "git+https://github.com/${{ github.repository }}@${{ github.ref }}",
                "digest": { "sha1": "${{ github.sha }}" },
                "entryPoint": ".github/workflows/publish-images.yml"
              }
            },
            "metadata": {
              "buildInvocationId": "${{ github.run_id }}-${{ github.run_attempt }}",
              "completeness": { "parameters": true, "environment": false, "materials": false },
              "reproducible": false
            },
            "materials": [
              {
                "uri": "git+https://github.com/${{ github.repository }}@${{ github.ref }}",
                "digest": { "sha1": "${{ github.sha }}" }
              }
            ]
          }
          EOF

      - name: Attest provenance
        run: cosign attest --yes --predicate provenance.json --type slsaprovenance "${{ steps.build.outputs.digest }}"

      - name: Verify signed image (self-check)
        run: |
          cosign verify \
            --certificate-identity-regexp \
            '^https://github\.com/${{ github.repository }}/\.github/workflows/publish-images\.yml@${{ github.ref }}$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ steps.build.outputs.digest }}"

      - name: Record fixture data
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ### Signed image fixture: ${{ matrix.image.name }}
          - digest: \`${{ steps.build.outputs.digest }}\`
          - oidc_issuer: \`https://token.actions.githubusercontent.com\`
          - cert_identity: \`https://github.com/${{ github.repository }}/.github/workflows/publish-images.yml@${{ github.ref }}\`
          EOF

  publish-dockerhub:
    needs: discover-images
    if: needs.discover-images.outputs.images != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.discover-images.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Determine version
        id: version
        run: |
          date_suffix="$(date -u +%Y%m%d)"
          case "${{ matrix.image.name }}" in
            dagster)
              base_version="$(grep -m1 '^dagster==' images/dagster/requirements.txt | cut -d= -f3)"
              ;;
            superset)
              base_version="$(grep -m1 '^FROM apache/superset:' images/superset/base/Dockerfile | sed -E 's#^FROM apache/superset:([^@[:space:]]+).*#\1#')"
              ;;
            *)
              echo "No version scheme defined for image '${{ matrix.image.name }}'" >&2
              exit 1
              ;;
          esac
          if [ -z "$base_version" ]; then
            echo "Failed to determine base version for '${{ matrix.image.name }}'" >&2
            exit 1
          fi
          echo "tag=${base_version}-${date_suffix}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ronaldsoeverein
          password: ${{ secrets.RONALDSOEVEREIN_LOGIN }}

      - name: Build and push
        run: |
          dockerfile="${{ matrix.image.dockerfile }}"
          context="$(dirname "$dockerfile")"
          case "$dockerfile" in
            images/dagster/*|images/superset/*) context="." ;;
          esac
          ref="docker.io/ronaldsoeverein/${{ matrix.image.name }}"
          tag="${{ steps.version.outputs.tag }}"
          docker build -f "$dockerfile" -t "$ref:$tag" -t "$ref:latest" "$context"
          docker push "$ref:$tag"
          docker push "$ref:latest"

      - name: Update Docker Hub overview
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ronaldsoeverein
          password: ${{ secrets.RONALDSOEVEREIN_LOGIN }}
          repository: ronaldsoeverein/${{ matrix.image.name }}
          readme-filepath: images/${{ matrix.image.name }}/README.md

  update-fixture:
    # Keep tests/fixtures/signed-images.json in sync with every successful
    # publish, so digest verification in the repo never drifts from what was
    # signed and attested. Committing only the fixture cannot re-trigger this
    # workflow (the push paths do not include tests/fixtures).
    needs: publish
    if: ${{ always() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refresh signed-images fixture after successful publish
        run: |
          set -euo pipefail
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          tag="sha-${GITHUB_SHA::12}"
          python3 - "$owner" "$tag" <<'PY'
          import datetime as _dt
          import json
          import pathlib
          import re
          import subprocess
          import sys

          owner, tag = sys.argv[1], sys.argv[2]
          fixture_path = pathlib.Path("tests/fixtures/signed-images.json")
          fixture = json.loads(fixture_path.read_text(encoding="utf-8"))

          digest_re = re.compile(r"^sha256:[0-9a-f]{64}$")
          changed = {}
          for name in sorted(fixture["images"]):
              repo = f"ghcr.io/{owner}/{name}"
              tagged = f"{repo}:{tag}"
              subprocess.run(["docker", "pull", tagged], check=True, stdout=subprocess.DEVNULL)
              digested = subprocess.check_output(
                  ["docker", "inspect", "--format", "{{index .RepoDigests 0}}", tagged],
                  text=True,
              ).strip()
              digest = digested.split("@")[-1]
              if not digest_re.match(digest):
                  raise SystemExit(f"unexpected digest for {name}: {digest}")
              entry = fixture["images"][name]
              if entry.get("digest") != digest:
                  entry["digest"] = digest
                  changed[name] = digest

          if changed:
              fixture["refreshRequired"] = False
              fixture["updated"] = _dt.date.today().isoformat()
              fixture["refreshInstructions"] = (
                  "Refreshed automatically by the update-fixture job in "
                  ".github/workflows/publish-images.yml after each successful publish."
              )
              fixture_path.write_text(json.dumps(fixture, indent=2) + "\n", encoding="utf-8")
              print("changed:", changed)
          else:
              print("no digest changes")
          PY

      - name: Commit fixture refresh if digests changed
        run: |
          if git status --porcelain -- tests/fixtures/signed-images.json | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests/fixtures/signed-images.json
            git commit -q -m "chore(images): refresh signed-images fixture"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "fixture unchanged; nothing to commit"
          fi
