name: Publish CLI to PyPI

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Determine version ref to verify
        id: version_ref
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "ref=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            # workflow_dispatch has no tag ref to check against; fall back to
            # pyproject.toml's own declared version so the pre-release guard
            # below still applies to manual publishes.
            version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
            echo "ref=v${version}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify tag matches pyproject.toml version and is not a pre-release
        run: |
          python -m pip install --upgrade pip packaging
          python scripts/check_release_version.py "${{ steps.version_ref.outputs.ref }}" --block-prerelease

  build:
    needs: [verify-version]
    uses: ./.github/workflows/build-python-package.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/composable-data-stack/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true
