name: Build and smoke-test Python package

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Build and check distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build==1.6.1 twine==7.0.0
          python -m build
          python -m twine check dist/*

      - name: Smoke test installed wheel
        run: |
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          python -m venv "$RUNNER_TEMP/cds-wheel"
          "$RUNNER_TEMP/cds-wheel/bin/python" -m pip install "$wheel"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/cds-wheel/bin/cds" --help
          "$RUNNER_TEMP/cds-wheel/bin/cds" validate \
            "$GITHUB_WORKSPACE/profiles/local-dagster-postgres-superset/profile.yaml"
          "$RUNNER_TEMP/cds-wheel/bin/python" -c \
            "from cli.security import _validate_rule_set; assert _validate_rule_set()['rules']"

      - name: Generate CLI SBOM
        # Generated from the same "$RUNNER_TEMP/cds-wheel" venv used for the
        # smoke test above, which has only the built wheel and its declared
        # runtime dependencies installed (no build/, twine, etc.), so the
        # SBOM reflects what a user actually installs, not this workflow's
        # own build tooling. Kept in a separate venv from cds-wheel so
        # cyclonedx-bom itself never leaks into the SBOM it generates.
        run: |
          python -m venv "$RUNNER_TEMP/cdx-tools"
          "$RUNNER_TEMP/cdx-tools/bin/pip" install --quiet cyclonedx-bom==7.4.0
          "$RUNNER_TEMP/cdx-tools/bin/cyclonedx-py" environment \
            "$RUNNER_TEMP/cds-wheel/bin/python" \
            --pyproject pyproject.toml \
            --output-format json \
            --output-reproducible \
            -o cli-sbom.cyclonedx.json

      - name: Validate CLI SBOM
        run: python scripts/validate_cli_sbom.py --sbom cli-sbom.cyclonedx.json

      - name: Generate release artifact inventory
        run: |
          python scripts/generate_release_inventory.py \
            --dist-dir dist \
            --sbom-file cli-sbom.cyclonedx.json \
            --commit-sha "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF_NAME" \
            --generated-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --generated-by "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --output release-inventory.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Smoke test full stack via cds get/init/up
        # Exercises the real end-user flow: install the built wheel with no
        # source checkout on CDS_PROFILE_PATH/CDS_MODULE_PATH, `cds get` a
        # profile and its assets into an empty directory, `cds init` it, and
        # bring the full docker compose stack up. This is the only check
        # that would have caught bugs limited to the packaged/get-fetched
        # layout (e.g. missing bundled assets, or project-root resolution
        # regressions) rather than the source-checkout install exercised
        # above.
        run: |
          stack_dir="$RUNNER_TEMP/cds-stack-smoke"
          rm -rf "$stack_dir"
          mkdir -p "$stack_dir"
          cd "$stack_dir"
          "$RUNNER_TEMP/cds-wheel/bin/cds" get local-dagster-postgres-superset \
            --local "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/cds-wheel/bin/cds" init local-dagster-postgres-superset
          "$RUNNER_TEMP/cds-wheel/bin/cds" up local-dagster-postgres-superset --timeout 600

      - name: Tear down full stack smoke test
        if: always()
        run: |
          stack_dir="$RUNNER_TEMP/cds-stack-smoke"
          if [ -f "$stack_dir/docker-compose.yml" ]; then
            docker compose -f "$stack_dir/docker-compose.yml" down -v --remove-orphans || true
          fi

      - name: Upload immutable distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Upload CLI SBOM and release artifact inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-package-release-evidence
          path: |
            cli-sbom.cyclonedx.json
            release-inventory.json
          if-no-files-found: error
          retention-days: 90
