name: Biweekly Practices Audit

# Rolls the adopted Impatient Programming practices (see CONTRIBUTING.md
# "How We Work") into one recurring report: contract coverage, the
# fix:/refine: commit mix, automerge usage, and the latest kill-matrix run.
# Files the report as an issue labeled `practices-audit` on a biweekly
# cadence (odd ISO weeks; the roadmap-freshness and issue-consistency audits
# own even weeks).

on:
  schedule:
    - cron: "37 7 * * 5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: biweekly-practices-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    outputs:
      should_run: ${{ steps.cadence.outputs.run }}
    steps:
      - name: Check biweekly cadence
        id: cadence
        shell: bash
        run: |
          week="$(date -u +%V)"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] \
            || ((10#"$week" % 2 == 1)); then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping even ISO week $week."
          fi

      - name: Checkout
        if: steps.cadence.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: the audit reads the commit mix of the last 14 days.
          fetch-depth: 0

      - name: Setup Python
        if: steps.cadence.outputs.run == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        if: steps.cadence.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run practices audit
        if: steps.cadence.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python scripts/check_practices_audit.py > "$RUNNER_TEMP/practices-audit.md"
          cat "$RUNNER_TEMP/practices-audit.md"

      - name: File or update the audit report issue
        if: steps.cadence.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          gh label create practices-audit \
            --repo "$GITHUB_REPOSITORY" \
            --color "6f42c1" \
            --description "Biweekly roll-up of the adopted Impatient Programming practices" \
            --force

          title="Impatient Programming practices audit (biweekly)"
          report="$RUNNER_TEMP/practices-audit-issue.md"
          {
            printf '<!-- practices-audit -->\n'
            printf 'Generated by [%s](%s/actions/runs/%s) from `scripts/check_practices_audit.py`.\n\n' \
              "$GITHUB_WORKFLOW" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            cat "$RUNNER_TEMP/practices-audit.md"
          } > "$report"

          existing="$(
            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --label practices-audit \
              --limit 10 \
              --json number,title \
              --jq ".[] | select(.title == \"$title\") | .number" \
              | head -n 1
          )"

          if [[ -n "$existing" ]]; then
            gh issue edit "$existing" \
              --repo "$GITHUB_REPOSITORY" \
              --body-file "$report"
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --label practices-audit \
              --body-file "$report"
          fi
