name: Release Checklist Reminder

# Catches the exact gap that let v0.5.2 sit merged-to-main for ~10 hours
# without ever being tagged/released, and the later gap that let v0.8.0 be
# tagged and released without ever getting a CHANGELOG.md entry (#605):
# a `chore(release): bump version to X.Y.Z` PR merges (version-bump.yml
# deliberately stops there and never touches the changelog, tags, or
# releases anything), and each remaining manual step -- changelog entry,
# git tag, Forgejo release, PyPI publish -- can be forgotten independently.
# This workflow does not perform any of those steps itself -- it only
# opens/updates a single tracking issue enumerating exactly which ones are
# still outstanding for the version currently on `main`, so the release is
# only considered done once every step is verifiably done.
#
# Codeberg/Forgejo migration notes (see docs/ci-codeberg.md): runs on a
# hosted codeberg-medium runner (the release-event propagation poll needs up
# to 8 minutes, capped to fit the 10-minute runner limit); fj (forgejo-cli)
# plus .forgejo/lib/api.sh replace the old gh shim; `secrets.GITHUB_TOKEN`
# -> the automatic github.token.

on:
  push:
    branches: [main]
  release:
    # Reconcile promptly once release.yml/the Forgejo UI actually publishes
    # the release, instead of leaving a stale reminder issue open until the
    # next daily cron run (up to ~24h later).
    types: [published]
  schedule:
    # Daily backstop in case the triggering push/release event is
    # missed/delayed, or the gap persists across multiple days.
    - cron: "43 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-tag-reminder
  cancel-in-progress: true

jobs:
  check:
    runs-on: codeberg-medium
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Setup fj (Forgejo CLI)
        uses: ./.forgejo/actions/setup-fj

      - name: Resolve release metadata
        id: meta
        run: |
          set -euo pipefail
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          package="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["name"])')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "package=${package}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Wait for release publication to fully propagate
        # A `release: published` event can fire slightly before the
        # matching tag/PyPI artifact are all consistently visible (git
        # fetch and PyPI's own index each lag independently). Poll with a
        # bounded deadline instead of a fixed `sleep 300`: this returns as
        # soon as both are visible (often much faster than 5 minutes). The
        # deadline is capped at 8 minutes to fit the codeberg-medium runner
        # time limit (10 min including checkout). Only this trigger needs
        # the wait; push/schedule/workflow_dispatch runs proceed immediately
        # since nothing was *just* published.
        if: github.event_name == 'release'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          PACKAGE: ${{ steps.meta.outputs.package }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 480))
          while [ "${SECONDS}" -lt "${deadline}" ]; do
            git fetch --tags --quiet
            tag_ready=false
            git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null && tag_ready=true

            pypi_ready=false
            status="$(curl -s --max-time 10 --retry 2 --retry-delay 3 \
              -o /dev/null -w '%{http_code}' \
              "https://pypi.org/pypi/${PACKAGE}/${VERSION}/json" || true)"
            [ "${status}" = "200" ] && pypi_ready=true

            if [ "${tag_ready}" = "true" ] && [ "${pypi_ready}" = "true" ]; then
              echo "Tag and PyPI artifact are both visible; continuing."
              exit 0
            fi
            sleep 15
          done
          echo "::warning::Tag/PyPI artifact still not fully visible after 8 minutes; proceeding with the check anyway."

      - name: Check every release step for the version on main
        id: check
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          PACKAGE: ${{ steps.meta.outputs.package }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          source .forgejo/lib/api.sh
          version="${VERSION}"
          package="${PACKAGE}"
          tag="${TAG}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          # 1. Dated CHANGELOG.md section (must exist whether or not the tag
          # has been pushed yet -- this is meant to be added before tagging).
          if grep -qE "^## \[${version//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}" CHANGELOG.md; then
            echo "changelog_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "changelog_ok=false" >> "$GITHUB_OUTPUT"
          fi

          # 2. Git tag pushed.
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "tag_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_ok=false" >> "$GITHUB_OUTPUT"
          fi

          # 3. Forgejo release published (not missing, not left as a draft).
          # release.yml is expected to publish it outright (see the comment
          # in that workflow), so "exists as a draft" is also a failure.
          is_draft="$(release_is_draft "${tag}")"
          if [ -n "$is_draft" ] && [ "${is_draft}" = "false" ]; then
            echo "release_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_ok=false" >> "$GITHUB_OUTPUT"
          fi

          # 4. Published to PyPI. Public JSON API, no auth needed. Bounded
          # --max-time plus a couple of --retry attempts so a hung/flaky
          # connection fails fast instead of stalling the job (and opening
          # a bogus incomplete-checklist issue on a false negative).
          status="$(curl -s --max-time 10 --retry 3 --retry-delay 5 \
            -o /dev/null -w '%{http_code}' \
            "https://pypi.org/pypi/${package}/${version}/json" || echo "000")"
          if [ "${status}" = "200" ]; then
            echo "pypi_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "pypi_ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update reminder issue
        if: |
          steps.check.outputs.changelog_ok == 'false' ||
          steps.check.outputs.tag_ok == 'false' ||
          steps.check.outputs.release_ok == 'false' ||
          steps.check.outputs.pypi_ok == 'false'
        env:
          VERSION: ${{ steps.check.outputs.version }}
          TAG: ${{ steps.check.outputs.tag }}
          PACKAGE: ${{ steps.meta.outputs.package }}
          CHANGELOG_OK: ${{ steps.check.outputs.changelog_ok }}
          TAG_OK: ${{ steps.check.outputs.tag_ok }}
          RELEASE_OK: ${{ steps.check.outputs.release_ok }}
          PYPI_OK: ${{ steps.check.outputs.pypi_ok }}
        run: |
          set -euo pipefail
          source .forgejo/lib/api.sh
          title="Release ${TAG} checklist incomplete"

          mark() { [ "$1" = "true" ] && echo "x" || echo " "; }

          body="\`pyproject.toml\` on \`main\` declares version \`${VERSION}\`. Not every step of the release process has been completed for it yet:

          - [$(mark "${CHANGELOG_OK}")] \`CHANGELOG.md\` has a dated \`## [${VERSION}] - YYYY-MM-DD\` section (not just \`[Unreleased]\`).
          - [$(mark "${TAG_OK}")] The \`${TAG}\` git tag has been pushed (\`git tag ${TAG} && git push origin ${TAG}\`), triggering the release/pypi pipelines.
          - [$(mark "${RELEASE_OK}")] The \`${TAG}\` release exists on Codeberg and is published (not left as a draft): ${FJ_FALLBACK_HOST}/${GITHUB_REPOSITORY}/-/releases/tag/${TAG}
          - [$(mark "${PYPI_OK}")] Version \`${VERSION}\` is published on PyPI: https://pypi.org/project/${PACKAGE}/${VERSION}/

          This issue was opened automatically by \`.forgejo/workflows/release-tag-reminder.yml\` and will auto-close the next time this check runs with every box above checked."

          q="$(jq -rn --arg t "$title" '$t|@uri')"
          existing="$(fj_get "repos/$FORGEJO_REPOSITORY/issues?state=open&type=issues&q=${q}&limit=50" \
            | jq -r --arg t "$title" '.[] | select(.title == $t) | .number' | head -n1)"

          if [ -n "$existing" ]; then
            fj issue -R origin edit "$existing" body "$body"
            fj issue -R origin comment "$existing" "Still incomplete as of this check."
          else
            create_issue "$title" "$body" "release"
          fi

      - name: Close resolved reminder issues
        if: |
          steps.check.outputs.changelog_ok == 'true' &&
          steps.check.outputs.tag_ok == 'true' &&
          steps.check.outputs.release_ok == 'true' &&
          steps.check.outputs.pypi_ok == 'true'
        run: |
          set -euo pipefail
          source .forgejo/lib/api.sh
          q="$(jq -rn --arg t 'checklist incomplete' '$t|@uri')"
          for number in $(fj_get "repos/$FORGEJO_REPOSITORY/issues?state=open&type=issues&q=${q}&limit=50" \
            | jq -r --arg t 'checklist incomplete' '.[] | select(.title | contains($t)) | .number'); do
            fj issue -R origin comment "$number" "Resolved: every release step (changelog, tag, Forgejo release, PyPI publish) is now confirmed done for this version."
            fj issue -R origin close "$number"
          done
