name: New Contributor Check

# Flags pull requests opened by first-time contributors so reviewers give
# them extra scrutiny (e.g. AI-assisted submissions from unfamiliar
# forks/accounts, per the CDS-SEC review guidance). This does not gate CI or
# block merging -- it only labels the PR and leaves a one-time comment with a
# review checklist. Uses pull_request_target (not pull_request) so it runs
# with repo-scoped credentials even for fork PRs, but it never checks out or
# executes the PR's own code -- only Forgejo API metadata is read.
#
# Codeberg/Forgejo migration notes (see docs/ci-codeberg.md):
# - `pull_request_target` is supported by Forgejo Actions.
# - GitHub's `author_association` is not in the Forgejo webhook payload, so the
#   association is derived via the API: a PR author who is not a collaborator
#   and has no previously merged PR in this repo is treated as a first-time
#   contributor (approximates FIRST_TIME_CONTRIBUTOR / FIRST_TIMER / NONE).
# - CLI: fj (forgejo-cli) for PR labels/comments; REST via .forgejo/lib/api.sh
#   for JSON queries. `secrets.GITHUB_TOKEN` -> the automatic `${{ github.token }}`.

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions:
  pull-requests: write
  issues: write

concurrency:
  group: new-contributor-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: codeberg-tiny
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup fj (Forgejo CLI)
        uses: ./.forgejo/actions/setup-fj

      - name: Evaluate author association
        id: author
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          source .forgejo/lib/api.sh
          # Collaborator/member/owner -> not new. Otherwise check for any
          # previously merged PR by this author in this repo.
          if curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: token $FORGEJO_TOKEN" \
              "$FORGEJO_API_URL/repos/$REPO/collaborators/$AUTHOR" | grep -q '^20'; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
            echo "association=collaborator" >> "$GITHUB_OUTPUT"
          elif fj_get "repos/$REPO/pulls?state=closed&limit=50" \
              | jq --arg a "$AUTHOR" \
                '[.[] | select(.user.login == $a and .merged == true)] | length' \
              | grep -q '^[1-9]'; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
            echo "association=contributor" >> "$GITHUB_OUTPUT"
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
            echo "association=first-time" >> "$GITHUB_OUTPUT"
          fi

      - name: Label first-time contributor PRs
        if: steps.author.outputs.is_new == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          source .forgejo/lib/api.sh
          ensure_label "new-contributor" "0e8a16" \
            "PR opened by a first-time contributor to this repository"
          fj pr -R origin edit "${PR_NUMBER}" labels --add "new-contributor"

      - name: Post review checklist (once)
        if: steps.author.outputs.is_new == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          ASSOCIATION: ${{ steps.author.outputs.association }}
        run: |
          set -euo pipefail
          source .forgejo/lib/api.sh
          marker="<!-- new-contributor-check -->"

          already_commented="$(fj_get "repos/$REPO/issues/${PR_NUMBER}/comments?limit=100" \
            | jq --arg m "$marker" '[.[] | select(.body | startswith($m))] | length')"

          if [ "${already_commented}" != "0" ]; then
            exit 0
          fi

          body="${marker}
          👋 This PR was opened by a first-time contributor to this repository (\`author_association: ${ASSOCIATION}\`).

          This is not a judgment on the change itself -- just a reminder for reviewers to apply extra scrutiny before merging, since there's no prior contribution history to calibrate trust against:

          - [ ] Confirm the PR description accurately reflects what the diff does (mismatches between claimed and actual behavior, e.g. stale CI status claims, can indicate the description was generated without re-checking).
          - [ ] Verify commit(s) look like an iterative human/AI-assisted process, not an unexplained wholesale diff.
          - [ ] Re-run or check CI/security-scan results directly rather than relying on the PR body's claims about test coverage.
          - [ ] Review any added dependencies, secrets handling, or CI/workflow changes with extra care -- these are common vectors for supply-chain issues.

          This comment is informational only and does not block merging."

          fj pr -R origin comment "${PR_NUMBER}" "$body"
