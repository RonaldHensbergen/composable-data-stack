name: Biweekly Roadmap Freshness Check

# Codeberg/Forgejo migration notes (see docs/ci-codeberg.md): runs on a
# hosted codeberg-small runner (the check script queries many issues through
# the API); fj (forgejo-cli) plus .forgejo/lib/api.sh replace the old gh
# shim, and scripts/check_roadmap_freshness.py reads the Forgejo REST API
# directly when FORGEJO_API_URL/FORGEJO_TOKEN are set.

on:
  schedule:
    - cron: "23 7 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: biweekly-roadmap-freshness
  cancel-in-progress: false

jobs:
  check:
    runs-on: codeberg-small
    permissions:
      contents: read
      issues: write
    outputs:
      should_run: ${{ steps.cadence.outputs.run }}
    steps:
      - name: Check biweekly cadence
        id: cadence
        shell: bash
        run: |
          week="$(date -u +%V)"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] \
            || ((10#"$week" % 2 == 0)); then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping odd ISO week $week."
          fi

      - name: Checkout
        if: steps.cadence.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup fj (Forgejo CLI)
        if: steps.cadence.outputs.run == 'true'
        uses: ./.forgejo/actions/setup-fj

      - name: Run roadmap freshness check
        if: steps.cadence.outputs.run == 'true'
        id: check
        shell: bash
        run: |
          set +e
          python3 scripts/check_roadmap_freshness.py > "$RUNNER_TEMP/roadmap-check.txt" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/roadmap-check.txt"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: File or update freshness report
        if: steps.cadence.outputs.run == 'true' && steps.check.outputs.status != '0'
        shell: bash
        run: |
          set -e
          source .forgejo/lib/api.sh
          ensure_label roadmap-audit "1d76db" \
            "docs/roadmap.md drifted from actual issue/PR state"

          title="docs/roadmap.md freshness check found stale entries"
          report="$RUNNER_TEMP/roadmap-freshness-report.md"
          {
            printf '<!-- roadmap-freshness-check -->\n'
            printf 'Generated by [%s](%s/-/actions/runs/%s) from `scripts/check_roadmap_freshness.py`.\n\n' \
              "$GITHUB_WORKFLOW" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf '```\n'
            cat "$RUNNER_TEMP/roadmap-check.txt"
            printf '```\n'
          } > "$report"

          existing="$(find_open_issue roadmap-audit "$title")"

          if [[ -n "$existing" ]]; then
            fj issue -R origin edit "$existing" body "$(cat "$report")"
          else
            create_issue "$title" "$(cat "$report")" roadmap-audit
          fi

      - name: Close stale report if roadmap is fresh again
        if: steps.cadence.outputs.run == 'true' && steps.check.outputs.status == '0'
        shell: bash
        run: |
          source .forgejo/lib/api.sh
          existing="$(fj_get "repos/$FORGEJO_REPOSITORY/issues?state=open&labels=roadmap-audit&limit=10" | jq -r '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            fj issue -R origin close "$existing" \
              --with-msg "docs/roadmap.md is consistent with current issue/PR state and version as of this biweekly check."
          fi
