version: 1.0.1
schema: v2
name: GitHub MCP
mcpServers:
  - name: GitHub
    command: docker
    args:
      - run
      - --rm
      - -i
      - -e
      - GITHUB_PERSONAL_ACCESS_TOKEN
      - -e
      - GITHUB_TOOLSETS=repos,issues,pull_requests
      - ghcr.io/github/github-mcp-server@sha256:250bc6ce70788207608ef74cef4397230ff2e8481218da74d6093e4bd9101132 # v2.0.3
