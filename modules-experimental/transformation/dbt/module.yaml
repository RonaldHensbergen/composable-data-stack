# yaml-language-server: $schema=../../../cli/resources/module.schema.json
apiVersion: cds/v1alpha1
kind: Module

metadata:
  name: dbt
  category: transformation
  version: "0.1.0"
  productionSuitable: false
  displayName: dbt (experimental)
  description: >
    Experimental dbt-core transformation module. Runs a bind-mounted dbt
    project's models/tests as a one-shot job against a consumed target
    warehouse -- either a client-server sql-database contract (e.g. the
    postgres module) or an embedded file-database contract (e.g. the duckdb
    module), selected via config.warehouseType -- and optionally serves
    generated dbt docs via a small nginx sidecar. See images/dbt/README.md
    for why this image is pinned to Python 3.13 instead of the repo's usual
    3.14 base.

spec:
  runtime:
    type: container
    service:
      name: dbt
      ports:
        - name: docs
          containerPort: 80
          protocol: TCP
      networks:
        - default

  configSchema:
    type: object
    additionalProperties: false
    required: []
    properties:
      project:
        type: object
        additionalProperties: false
        default: {}
        properties:
          hostPath:
            type: string
            minLength: 1
            default: ./workdirs/dbt
          containerPath:
            type: string
            minLength: 1
            pattern: "^/"
            default: /usr/app/dbt

      warehouseType:
        type: string
        enum:
          - postgres
          - duckdb
        default: postgres
        description: >
          Selects which consumed target the rendered dbt profile points at.
          "postgres" requires targetDatabase.contractRef to reference a
          sql-database provider; "duckdb" requires
          targetWarehouseFile.contractRef to reference a file-database
          provider. Only one of targetDatabase/targetWarehouseFile needs to
          be set, matching this value -- each consume entry's requiredIf
          below enforces the match at compile time (E041), so a mismatch
          fails `cds validate`/`cds test` instead of only being caught by
          entrypoint.sh's runtime check at container start.

      targetDatabase:
        type: object
        additionalProperties: false
        default: {}
        properties:
          contractRef:
            type: string
            pattern: "^[a-z0-9-]+\\.[a-z0-9-]+$"

      targetWarehouseFile:
        type: object
        additionalProperties: false
        default: {}
        properties:
          contractRef:
            type: string
            pattern: "^[a-z0-9-]+\\.[a-z0-9-]+$"
        description: >
          The consumed file-database contract's shared directory is always
          bind-mounted to the fixed container path /usr/app/dbt_duckdb
          (hardcoded in the compose template, not user-configurable) --
          this field only needs contractRef. Keeping this object free of
          its own defaulted properties matters: CDS's schema-default
          application recursively fills in nested property defaults even
          when the whole object is omitted, which would otherwise make an
          unset-but-still-non-empty targetWarehouseFile indistinguishable
          from a real binding and break the required:false skip-when-unset
          behavior below.

      schema:
        type: string
        minLength: 1
        default: public

      threads:
        type: integer
        minimum: 1
        default: 4

      commands:
        type: string
        minLength: 1
        default: |
          run
          test
          docs generate
        description: >
          Newline-separated dbt subcommands run in order by the entrypoint
          (e.g. "run\ntest\ndocs generate"). Add "deps" as the first line if
          the project has a packages.yml.

      docs:
        type: object
        additionalProperties: false
        default: {}
        properties:
          enabled:
            type: boolean
            default: true
          port:
            type: integer
            minimum: 1
            maximum: 65535
            default: 8090

      healthcheck:
        type: object
        additionalProperties: false
        default: {}
        properties:
          enabled:
            type: boolean
            default: true

  consumes:
    - name: target-database
      contract:
        kind: sql-database
      required: false
      requiredIf: "config.warehouseType==postgres"
      mappedFrom: spec.config.targetDatabase

    - name: target-warehouse-file
      contract:
        kind: file-database
      required: false
      requiredIf: "config.warehouseType==duckdb"
      mappedFrom: spec.config.targetWarehouseFile

  provides:
    - name: docs-service
      contract:
        kind: http-service
        spec:
          portFrom: spec.config.docs.port
          healthPath: /
          protocol: http

  implementation:
    kind: docker-compose
    compose:
      services:
        dbt-run:
          build:
            context: ../../../
            dockerfile: images/dbt/Dockerfile
          image: local/dbt:custom
          restart: "no"
          init: true
          read_only: true
          cap_drop:
            - ALL
          security_opt:
            - no-new-privileges:true
          pids_limit: 256
          tmpfs:
            - /tmp:rw,noexec,nosuid,nodev,uid=999,gid=999,mode=1777
            - /home/dbt/.dbt:rw,noexec,nosuid,nodev,uid=999,gid=999,mode=0700
          hostname: "${service.host}"
          healthcheck:
            disable: true
          volumes:
            - type: bind
              source: "${config.project.hostPath}"
              target: "${config.project.containerPath}"
              read_only: true
            - dbt-target:/usr/app/dbt_target
            - dbt-logs:/usr/app/dbt_logs
            - type: bind
              source: "${bindings.target-warehouse-file.hostDirectory}"
              target: /usr/app/dbt_duckdb
              enabledFrom: "config.warehouseType==duckdb"
          # Both targets' env vars are always present in this template, but
          # only one is active per instance (config.warehouseType). The
          # postgres vars use ifNonempty because they must tolerate being
          # unbound when duckdb is selected; the duckdb vars use a plain
          # ref because the requiredIf gates on target-database/
          # target-warehouse-file above guarantee target-warehouse-file is
          # always bound when duckdb is selected (E041 fails the build
          # otherwise), so there's nothing to tolerate on that side.
          environment:
            DBT_WAREHOUSE_TYPE: "${config.warehouseType}"
            DBT_HOST: "${ifNonempty:bindings.target-database.host,,}"
            DBT_PORT: "${ifNonempty:bindings.target-database.port,,}"
            DBT_DBNAME: "${ifNonempty:bindings.target-database.database,,}"
            DBT_USER: "${ifNonempty:bindings.target-database.username,,}"
            DBT_PASSWORD: "${ifNonempty:bindings.target-database.password,,}"
            DBT_DUCKDB_PATH: "/usr/app/dbt_duckdb/${ifNonempty:bindings.target-warehouse-file.filename,,}"
            DBT_SCHEMA: "${config.schema}"
            DBT_THREADS: "${config.threads}"
            DBT_COMMANDS: "${config.commands}"
            DBT_PROJECT_DIR: "${config.project.containerPath}"

        dbt-docs:
          enabledFrom: config.docs.enabled
          image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
          user: nginx
          init: true
          read_only: true
          cap_drop:
            - ALL
          security_opt:
            - no-new-privileges:true
          pids_limit: 64
          tmpfs:
            - /tmp:rw,noexec,nosuid,nodev,uid=101,gid=101,mode=1777
          depends_on:
            dbt-run:
              condition: service_completed_successfully
          ports:
            - "127.0.0.1:${config.docs.port}:80"
          volumes:
            - type: bind
              source: ./images/dbt/nginx.conf
              target: /etc/nginx/nginx.conf
              read_only: true
            - type: volume
              source: dbt-target
              target: /usr/share/nginx/html
              read_only: true
          healthcheck:
            conditionallyEnabledFrom: config.healthcheck.enabled
            test:
              - CMD
              - wget
              - -qO-
              - http://127.0.0.1/
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

      volumes:
        dbt-target: {}
        dbt-logs: {}
