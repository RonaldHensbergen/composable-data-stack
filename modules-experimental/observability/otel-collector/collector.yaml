# OpenTelemetry Collector configuration for the CDS otel-collector module
# (modules-experimental/observability/otel-collector, issue #777).
#
# Receives OTLP logs/metrics/traces on gRPC (4317) and HTTP (4318), and
# forwards each signal to the bound backend module over OTLP/HTTP when a
# `backends.<signal>` binding is configured. The backend's connectionUri
# arrives as an environment variable rendered from the contract binding;
# an unbound signal leaves the per-signal endpoint empty, in which case the
# static discard `endpoint` (127.0.0.1:1) is used — export failures are
# non-fatal, and every pipeline also exports to the collector's own log.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:${env:OTLP_GRPC_PORT}
      http:
        endpoint: 0.0.0.0:${env:OTLP_HTTP_PORT}

extensions:
  health_check:
    endpoint: 0.0.0.0:${env:HEALTH_PORT}

processors:
  batch: {}

exporters:
  logging:
    loglevel: info
  otlphttp/logs:
    endpoint: http://127.0.0.1:1
    logs_endpoint: ${env:BACKEND_LOGS_ENDPOINT}
  otlphttp/metrics:
    endpoint: http://127.0.0.1:1
    metrics_endpoint: ${env:BACKEND_METRICS_ENDPOINT}
  otlphttp/traces:
    endpoint: http://127.0.0.1:1
    traces_endpoint: ${env:BACKEND_TRACES_ENDPOINT}

service:
  extensions: [health_check]
  pipelines:
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [logging, otlphttp/logs]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [logging, otlphttp/metrics]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [logging, otlphttp/traces]
