# OpenTelemetry Collector configuration for the CDS otel-collector module
# (modules-experimental/observability/otel-collector, issues #777, #1076).
#
# Receives OTLP logs/metrics/traces on gRPC (4317) and HTTP (4318), and
# forwards each signal to the bound backend module over OTLP/HTTP when a
# `backends.<signal>` binding is configured. The backend's full ingest URL
# (connectionUri + ingestPath) arrives as an environment variable rendered
# from the contract binding; the otlp_http exporter uses a per-signal
# *_endpoint as the complete URL — it does not append /v1/<signal> — so the
# ingest path must be part of the value. An unbound signal leaves the
# per-signal endpoint empty, in which case the base `endpoint` applies: the
# collector's own health_check extension, which answers the export POST with
# 200 on any path, so the batch is discarded silently — unlike a dead port
# (127.0.0.1:1), whose connection-refused failures retry forever and fill the
# collector log (verified against the pinned image). Every pipeline also
# exports to the collector's own log.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:${env:OTLP_GRPC_PORT}
      http:
        endpoint: 0.0.0.0:${env:OTLP_HTTP_PORT}

extensions:
  health_check:
    # Must stay 0.0.0.0: the pinned 0.164.0 image defaults this extension to
    # localhost:13133, and the module publishes the port to the host as
    # 127.0.0.1:<healthPort>:13133 — with a localhost bind that mapping
    # would never answer from the host (issue #1167).
    endpoint: 0.0.0.0:${env:HEALTH_PORT}

processors:
  batch: {}

exporters:
  # `logging` was removed in collector v0.164 ("use the debug exporter
  # instead"); `detailed` logs every record like the old `logging` exporter
  # did (and like the docker smoke test asserts, issue #1065).
  debug:
    verbosity: detailed
  # Canonical `otlp_http` name: the `otlphttp` alias logs a deprecation
  # warning on every startup of the pinned 0.164.0 image (issue #1167).
  otlp_http/logs:
    # Unbound signal: the empty per-signal endpoint falls back to this base
    # endpoint — the collector's own health_check, which answers the export
    # POST with 200 and drops the batch silently, no retries (see the header
    # comment).
    endpoint: http://127.0.0.1:${env:HEALTH_PORT}
    logs_endpoint: ${env:BACKEND_LOGS_ENDPOINT}
  otlp_http/metrics:
    endpoint: http://127.0.0.1:${env:HEALTH_PORT}
    metrics_endpoint: ${env:BACKEND_METRICS_ENDPOINT}
  otlp_http/traces:
    endpoint: http://127.0.0.1:${env:HEALTH_PORT}
    traces_endpoint: ${env:BACKEND_TRACES_ENDPOINT}

service:
  extensions: [health_check]
  pipelines:
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlp_http/logs]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlp_http/metrics]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlp_http/traces]
