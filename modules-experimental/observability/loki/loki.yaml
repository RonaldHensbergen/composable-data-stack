auth_enabled: false

server:
  http_listen_port: 3100

# Native OTLP/HTTP ingest (POST /otlp/v1/logs) is served on the same HTTP
# port since Loki 3.0 and needs no extra toggle. The resource attributes
# below are promoted to index labels (dots become underscores); all other
# attributes are stored per log line as structured metadata
# (allow_structured_metadata defaults to true in Loki 3.x and is set
# explicitly below). Shippers can set a `tier="structured"` resource
# attribute to land in the longer structured retention stream (issue #1076).
distributor:
  otlp_config:
    default_resource_attributes_as_index_labels:
      - service.name
      - deployment.environment.name
      - tier

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  retention_period: ${RAW_RETENTION_DAYS}
  retention_stream:
    - selector: '{tier="structured"}'
      priority: 1
      period: ${STRUCTURED_RETENTION_DAYS}

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
