# yaml-language-server: $schema=../../../cli/resources/module.schema.json
apiVersion: cds/v1alpha1
kind: Module

metadata:
  name: loki
  category: observability
  version: "0.1.0"
  productionSuitable: false
  displayName: Loki log aggregation (experimental)
  description: >
    Local and development log aggregation using Grafana Loki as the log
    store, with Vector as a host-loopback plain-JSON ingestion gateway.
    Provides the shared log-sink contract over Loki's native OTLP/HTTP
    endpoint (/otlp/v1/logs) with separate retention for raw records and
    structured runtime events, so OTLP-capable shippers (e.g. the
    otel-collector module's backends.logs) can forward logs end-to-end
    (issue #1076). The unauthenticated endpoint and single-node storage are
    not suitable for production.

spec:
  runtime:
    type: container
    service:
      name: loki-storage
      ports:
        - name: otlp-http
          containerPort: 3100
          protocol: TCP
      networks:
        - default

  configSchema:
    type: object
    additionalProperties: false
    properties:
      ingestPort:
        type: integer
        minimum: 1
        maximum: 65535
        default: 8686
        description: >-
          Host loopback port for the Vector plain-JSON gateway (/logs). Other
          Compose services and OTLP shippers should use the provided log-sink
          contract, which advertises Loki's native OTLP/HTTP endpoint
          (/otlp/v1/logs on the loki-storage service).

      rawRetentionDays:
        type: integer
        minimum: 1
        default: 7
        description: Retention for raw log records that do not match the structured event shape.

      structuredRetentionDays:
        type: integer
        minimum: 1
        default: 90
        description: Retention for records with the required structured-event fields.

  provides:
    - name: log-sink
      contract:
        kind: log-sink
        spec:
          # This module renders two compose services (loki, loki-storage);
          # the `loki-storage` service serves Loki's native OTLP/HTTP ingest
          # endpoint (/otlp/v1/logs on port 3100, enabled by default since
          # Loki 3.0), so the contract points at its rendered DNS name
          # through the renderer's service-naming rule (issue #1029).
          # serviceName advertises the same serving service explicitly for
          # the E150 host cross-check, matching the marquez module.
          # connectionUri lets OTLP/HTTP forwarders (e.g. the otel-collector
          # module's backends.logs) dial connectionUri + ingestPath directly
          # (issue #1076).
          host: ${service.services.loki-storage}
          # Consumers use the in-network OTLP listener on the storage service.
          port: 3100
          protocol: otlp-http
          ingestPath: /otlp/v1/logs
          connectionUri: http://${service.services.loki-storage}:3100
          rawRetentionDays: ${config.rawRetentionDays}
          structuredRetentionDays: ${config.structuredRetentionDays}
          serviceName: loki-storage

  implementation:
    kind: docker-compose
    compose:
      services:
        # The Vector service is a plain-JSON (one object per POST /logs)
        # ingestion gateway published on the host loopback for local dev
        # tools; it classifies records into the retention tiers and pushes
        # them to Loki's push API. The log-sink contract instead advertises
        # loki-storage's native OTLP/HTTP endpoint (issue #1076), which
        # OTLP-capable shippers such as the otel-collector module use.
        loki:
          image: timberio/vector:0.51.0-alpine@sha256:cef2a4d33b43b3e9196ba0bd9f1d8b9006a03bfe15363514c5a0f78b8cb8e9d9
          command:
            - --config
            - /etc/vector/vector.yaml
          restart: unless-stopped
          user: "1000:1000"
          read_only: true
          cap_drop:
            - ALL
          security_opt:
            - no-new-privileges:true
          pids_limit: 128
          tmpfs:
            - /tmp:rw,noexec,nosuid,nodev,uid=1000,gid=1000,mode=0700
          ports:
            - "127.0.0.1:${config.ingestPort}:8686"
          volumes:
            - type: bind
              source: vector.yaml
              target: /etc/vector/vector.yaml
              read_only: true
          environment:
            # ${service.services.<name>} maps through the renderer's
            # service-naming rule (issue #1029), so the storage service
            # resolves for any module instance id — including the namesake
            # `loki`, where `${service.host}-loki-storage` would render a
            # non-existent `loki-loki-storage` DNS name.
            LOKI_ENDPOINT: "http://${service.services.loki-storage}:3100"
          depends_on:
            loki-storage:
              condition: service_started

        loki-storage:
          image: grafana/loki:3.6.1@sha256:92bd5700577b6640235820c49ab454fbd792675ba8f4898ac56d522058a88389
          command:
            - -config.file=/etc/loki/loki.yaml
            - -config.expand-env=true
          restart: unless-stopped
          user: "10001:10001"
          read_only: true
          cap_drop:
            - ALL
          security_opt:
            - no-new-privileges:true
          pids_limit: 256
          tmpfs:
            - /tmp:rw,noexec,nosuid,nodev,uid=10001,gid=10001,mode=0700
          volumes:
            - type: bind
              source: loki.yaml
              target: /etc/loki/loki.yaml
              read_only: true
            - loki-data:/loki
          environment:
            RAW_RETENTION_DAYS: "${config.rawRetentionDays}d"
            STRUCTURED_RETENTION_DAYS: "${config.structuredRetentionDays}d"

      volumes:
        loki-data: {}
