# yaml-language-server: $schema=../../../cli/resources/profile.schema.json
# Environment overlay: production. Merge over profile.yaml by invoking with
# --environment prod, e.g.
# `cds render team-dagster-postgres-superset --environment prod`.
# Promoting metadata.environment to "production" switches on CDS's
# production security policy (see cli/security.py) for the resolved profile.
metadata:
  environment: production

spec:
  modules:
    - id: postgres
      config:
        storage:
          size: 20Gi
        # Production relational databases must use an explicit modern
        # password method for host (TCP) connections; trust authentication
        # is rejected by validation (E139, issue #206). Set explicitly
        # because validation runs before configSchema defaults apply.
        authentication:
          hostAuth: scram-sha-256
        # Built-in backup capability (issue #665): pgBackRest sidecar with
        # continuous WAL archiving, daily full and hourly incremental
        # backups into an encrypted repository volume.
        backup:
          enabled: true
          encryptionKeyFrom: secrets.backup_encryption_key
        # Dedicated metadata database for the identity provider (issue
        # #1273): Keycloak's realm/user store gets its own database and user,
        # advertised as postgres.identity-database, instead of sharing the
        # analytics database. The init-db script provisions it from the
        # IDENTITY_DB_* initDbEnv entries below.
        identityDatabase:
          name: "${CDS_IDENTITY_DB_NAME}"
          username: "${CDS_IDENTITY_DB_USER}"
          passwordFrom: secrets.identity_db_password
        initDbEnv:
          IDENTITY_DB_NAME: config.identityDatabase.name
          IDENTITY_DB_USER: config.identityDatabase.username
          IDENTITY_DB_PASSWORD: config.identityDatabase.passwordFrom

    # Identity provider (issue #1273, loose end of #370): Keycloak serves SSO
    # for the admin UIs. It binds its metadata store to the dedicated
    # postgres.identity-database contract and publishes oidc-provider, which
    # the Superset module below consumes. Its only host publish stays
    # loopback-only; browsers reach it through the TLS edge route generated
    # from keycloak.http-service (traefik's routes entry below).
    - id: keycloak
      source: ../../modules/identity/keycloak
      version: "0.1.0"
      enabled: true
      dependsOn:
        - postgres
      config:
        httpPort: 8081
        # Canonical issuer URL as seen by browsers and by in-network
        # consumers: the TLS edge route for identity.cds.local must resolve
        # to this host from both (add it to the team DNS or hosts files).
        publicUrl: https://identity.cds.local
        realm: cds
        metadataDatabase:
          contractRef: postgres.identity-database
          driver: postgres
        adminUser:
          username: admin
          passwordFrom: secrets.keycloak_admin_password
        # Declarative OIDC client provisioning (issue #1074): the Superset
        # consumer gets its client in the imported "cds" realm, with the
        # secret staying a ${CDS_*} runtime placeholder.
        oidcClients:
          - clientId: superset
            redirectUris:
              - https://superset.cds.local/oauth-authorized/keycloak
            webOrigins:
              - https://superset.cds.local
            secretFrom: secrets.superset_oidc_client_secret
        healthcheck:
          enabled: true

    # Superset delegates admin-UI authentication to Keycloak (issue #1273,
    # module surface since #1064): binding identityProvider switches on
    # OAuth in the rendered superset config and clears CDS-SEC-081 for the
    # superset service. Dagster has no native OIDC consume; its webserver is
    # covered by the profile-wide identity-module signal of CDS-SEC-081 and
    # should be fronted by a proxy-level middleware until it grows one.
    - id: superset
      dependsOn:
        - postgres
        - keydb
        - keycloak
      config:
        identityProvider:
          contractRef: keycloak.oidc-provider
          clientId: superset
          clientSecretFrom: secrets.superset_oidc_client_secret

    # The edge also routes the identity provider's hostname (issue #883):
    # the route is generated from keycloak's http-service contract into
    # traefik/dynamic/cds-routes-traefik.yml at render time, so no backend
    # service name is hardcoded here.
    - id: traefik
      dependsOn:
        - dagster
        - superset
        - keycloak
      config:
        routes:
          - host: identity.cds.local
            contractRef: keycloak.http-service

  # Production profiles must declare encrypted backup policies per workload
  # class (see docs/backup-restore.md). The cache class is deliberately
  # absent: cache contents are disposable by design. The warehouse policies
  # bind to the postgres module's built-in backup-target provider (issue
  # #665), which advertises client-side encryption and restore verification.
  secrets:
    values:
      backup_encryption_key:
        env: CDS_BACKUP_ENCRYPTION_KEY
        required: true
      identity_db_password:
        env: CDS_IDENTITY_DB_PASSWORD
        required: true
      keycloak_admin_password:
        env: CDS_KEYCLOAK_ADMIN_PASSWORD
        required: true
      superset_oidc_client_secret:
        env: CDS_SUPERSET_OIDC_CLIENT_SECRET
        required: true

  backup:
    target:
      contractRef: postgres.backup-target
    encryption:
      keyFrom: secrets.backup_encryption_key
    policies:
      - workloadClass: warehouse
        retentionDays: 30
        rpoMinutes: 60
        rtoMinutes: 240
        restoreVerification:
          frequencyDays: 30
      - workloadClass: orchestration-metadata
        retentionDays: 30
        rpoMinutes: 60
        rtoMinutes: 240
        restoreVerification:
          frequencyDays: 30
      - workloadClass: bi-metadata
        retentionDays: 30
        rpoMinutes: 1440
        rtoMinutes: 480
        restoreVerification:
          frequencyDays: 90
      # Keycloak's realm/user database (issue #1273): identity metadata is
      # re-creatable from the IdP's own export, so a day-level RPO suffices.
      - workloadClass: identity-metadata
        retentionDays: 30
        rpoMinutes: 1440
        rtoMinutes: 240
        restoreVerification:
          frequencyDays: 90
      - workloadClass: configuration
        retentionDays: 90
        rpoMinutes: 1440
        rtoMinutes: 120
        restoreVerification:
          frequencyDays: 90

  # The production runtime policy (CDS-SEC-090, see docs/runtime-confinement.md)
  # requires an explicit non-root user per service. The Dagster and Superset
  # images set a non-root USER in their Dockerfiles, which CDS cannot see, so
  # waive that single check with the documented reason.
  security:
    waivers:
      runtimePolicy:
        reason: Dagster and Superset images set a non-root USER in their Dockerfiles.
        checks: [nonRootUser]
