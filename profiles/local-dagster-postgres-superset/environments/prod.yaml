# yaml-language-server: $schema=../../../cli/resources/profile.schema.json
# Example environment overlay: production. Merged over profile.yaml when
# invoking with --environment prod, e.g. `cds plan local-dagster-postgres-superset --environment prod`.
# Promoting metadata.environment to "production" also switches on CDS's
# production security policy (see cli/security.py) for the resolved profile.
metadata:
  environment: production

spec:
  modules:
    - id: postgres
      config:
        storage:
          size: 20Gi

  # The production runtime policy (CDS-SEC-090, see docs/runtime-confinement.md)
  # requires an explicit non-root user per service. The Dagster and Superset
  # images set a non-root USER in their Dockerfiles, which CDS cannot see, so
  # waive that single check with the documented reason.
  security:
    waivers:
      runtimePolicy:
        reason: Dagster and Superset images set a non-root USER in their Dockerfiles.
        checks: [nonRootUser]
