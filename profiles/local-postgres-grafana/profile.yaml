# profiles/local-postgres-grafana/profile.yaml
# yaml-language-server: $schema=../../cli/resources/profile.schema.json
apiVersion: cds/v1alpha1
kind: Profile

metadata:
  name: local-postgres-grafana
  environment: local
  displayName: Local Postgres + Grafana
  description: >
    Minimal local development stack demonstrating the experimental Grafana
    observability module (#369): a Postgres warehouse whose `sql-database`
    contract is provisioned as a Grafana "Warehouse" datasource.
    See modules-experimental/observability/grafana/README.md.

spec:
  runtime:
    type: docker-compose
    namespace: cds-local
    networks:
      - name: cds-local
        driver: bridge

  modules:
    - id: postgres
      source: ../../modules/warehouse/postgres
      version: "0.1.0"
      enabled: true
      config:
        database: "${CDS_ANALYTICS_DB_NAME}"
        username: "${CDS_ANALYTICS_DB_USER}"
        passwordFrom: secrets.analytics_db_password
        superuserPasswordFrom: secrets.postgres_superuser_password
        port: 5432
        initDbScript: init-db.sh
        initDbEnv:
          ANALYTICS_DB_NAME: config.database
          ANALYTICS_DB_USER: config.username
          ANALYTICS_DB_PASSWORD: config.passwordFrom
        storage:
          enabled: true
          size: 5Gi
        healthcheck:
          enabled: true

    - id: grafana
      source: ../../modules-experimental/observability/grafana
      version: "0.1.0"
      enabled: true
      dependsOn:
        - postgres
      config:
        webPort: 3000
        adminUser:
          username: admin
          passwordFrom: secrets.grafana_admin_password
        warehouseDatabase:
          contractRef: postgres.sql-database
        healthcheck:
          enabled: true

  secrets:
    provider:
      type: env
    values:
      postgres_superuser_password:
        env: CDS_POSTGRES_SUPERUSER_PASSWORD
        required: true
      analytics_db_password:
        env: CDS_ANALYTICS_DB_PASSWORD
        required: true
      grafana_admin_password:
        env: CDS_GRAFANA_ADMIN_PASSWORD
        required: true
