# modules/bi/superset/module.yaml
# yaml-language-server: $schema=../../../cli/resources/module.schema.json
apiVersion: cds/v1alpha1
kind: Module

metadata:
  name: superset
  category: bi
  version: "0.1.0"
  displayName: Superset
  description: >
    Apache Superset BI service with a metadata database binding.

spec:
  runtime:
    type: container
    service:
      name: superset
      ports:
        - name: http
          containerPort: 8088
          protocol: TCP
      networks:
        - default

  configSchema:
    type: object
    additionalProperties: false
    required:
      - webPort
      - secretKeyFrom
      - adminUser
      - metadataDatabase
    properties:
      webPort:
        type: integer
        minimum: 1
        maximum: 65535
        default: 8088

      image:
        type: object
        additionalProperties: false
        default: {}
        properties:
          source:
            type: string
            enum:
              - build
              - registry
            default: build
            description: >
              Selects how the superset-init and superset services obtain
              their image. "build" (default) builds the image locally from
              images/superset/base/Dockerfile. "registry" pulls the
              already published, scanned, and signed image from
              docker.io/ronaldsoeverein/superset instead of building it,
              avoiding a local rebuild. Requires image.tag to be set.
          tag:
            type: string
            # cds-registry-tag-source: docker/apache/superset -- kept in
            # sync with the apache/superset base tag pinned in
            # images/superset/base/Dockerfile by Renovate; see
            # renovate.json's customManagers. Used as the default tag when
            # `cds render/up/test --image-source registry` is passed
            # without an explicit config.image.tag.
            default: "6.1.0"
            description: >
              Registry tag to pull when image.source is "registry", e.g. a
              version published by .github/workflows/publish-images.yml
              (derived from the apache/superset base version pinned in
              images/superset/base/Dockerfile). Ignored when image.source
              is "build". Defaults to the pinned apache/superset version
              above, kept in sync by Renovate; pass an explicit
              config.image.tag (or `--image-tag`) to override.

      secretKeyFrom:
        type: string
        pattern: "^secrets\\.[a-zA-Z0-9_-]+$"

      adminUser:
        type: object
        additionalProperties: false
        required:
          - username
          - passwordFrom
          - email
        properties:
          username:
            type: string
            minLength: 1
          passwordFrom:
            type: string
            pattern: "^secrets\\.[a-zA-Z0-9_-]+$"
          email:
            type: string
            minLength: 3

      metadataDatabase:
        type: object
        additionalProperties: false
        required:
          - contractRef
        properties:
          contractRef:
            type: string
            pattern: "^[a-z0-9-]+\\.[a-z0-9-]+$"

      cacheService:
        type: object
        additionalProperties: false
        default: {}
        properties:
          contractRef:
            type: string
            pattern: "^[a-z0-9-]+\\.[a-z0-9-]+$"
            description: "Reference to cache-service binding (e.g., keydb.cache-service)"

      healthcheck:
        type: object
        additionalProperties: false
        default: {}
        properties:
          enabled:
            type: boolean
            default: true

  consumes:
    - name: metadata-database
      contract:
        kind: sql-database
      required: true
      mappedFrom: spec.config.metadataDatabase

    - name: cache-service
      contract:
        kind: cache-service
      required: false
      mappedFrom: spec.config.cacheService

  provides:
    - name: http-service
      contract:
        kind: http-service
        spec:
          portFrom: spec.config.webPort
          healthPath: /health
          protocol: http

  implementation:
    kind: docker-compose
    compose:
      services:
        superset-init:
          build:
            context: ../../../
            dockerfile: images/superset/base/Dockerfile
          image: local/superset:custom
          read_only: true
          cap_drop:
            - ALL
          security_opt:
            - no-new-privileges:true
          tmpfs:
            - /tmp:rw,noexec,nosuid,nodev
            - /app/superset_home:rw,noexec,nosuid,nodev
          entrypoint:
            - /app/docker/init.sh
          environment:
            SUPERSET_SECRET_KEY: "${config.secretKeyFrom}"
            SUPERSET_ADMIN_USERNAME: "${config.adminUser.username}"
            SUPERSET_ADMIN_PASSWORD: "${config.adminUser.passwordFrom}"
            SUPERSET_ADMIN_EMAIL: "${config.adminUser.email}"
            SUPERSET__SQLALCHEMY_DATABASE_URI: "${bindings.metadata-database.connectionUri}"
            SUPERSET__REDIS_URL: "${bindings.cache-service.connectionUri}"
            SUPERSET__CACHE_CONFIG: '{"CACHE_TYPE": "redis", "CACHE_REDIS_URL": "${bindings.cache-service.connectionUri}", "CACHE_DEFAULT_TIMEOUT": 300}'
          healthcheck:
            disable: true
          restart: "no"
        superset:
          build:
            context: ../../../
            dockerfile: images/superset/base/Dockerfile
          image: local/superset:custom
          read_only: true
          cap_drop:
            - ALL
          security_opt:
            - no-new-privileges:true
          tmpfs:
            - /tmp:rw,noexec,nosuid,nodev
            - /app/superset_home:rw,noexec,nosuid,nodev
          ports:
            - "${config.webPort}:8088"
          depends_on:
            superset-init:
              condition: service_completed_successfully
          environment:
            SUPERSET_SECRET_KEY: "${config.secretKeyFrom}"
            SUPERSET__SQLALCHEMY_DATABASE_URI: "${bindings.metadata-database.connectionUri}"
            # Redis cache configuration
            SUPERSET__REDIS_URL: "${bindings.cache-service.connectionUri}"
            SUPERSET__CACHE_CONFIG: '{"CACHE_TYPE": "redis", "CACHE_REDIS_URL": "${bindings.cache-service.connectionUri}", "CACHE_DEFAULT_TIMEOUT": 300}'
          healthcheck:
            conditionallyEnabledFrom: config.healthcheck.enabled
            test:
              - CMD
              - python
              - -c
              - "import urllib.request; urllib.request.urlopen('http://localhost:8088/health')"
            start_period: 180s
            interval: 10s
            timeout: 5s
            retries: 20
