# modules/warehouse/postgres/module.yaml
# yaml-language-server: $schema=../../../cli/resources/module.schema.json
apiVersion: cds/v1alpha1
kind: Module

metadata:
  name: postgres
  category: warehouse
  version: "0.1.0"
  displayName: PostgreSQL
  description: >
    PostgreSQL database module that provides a sql-database contract.

spec:
  runtime:
    type: container
    service:
      name: postgres
      ports:
        - name: postgres
          containerPort: 5432
          protocol: TCP
      networks:
        - default

  configSchema:
    type: object
    additionalProperties: false
    required:
      - database
      - username
      - passwordFrom
      - superuserPasswordFrom
      - port
    properties:
      database:
        type: string
        minLength: 1

      username:
        type: string
        minLength: 1

      passwordFrom:
        type: string
        pattern: "^secrets\\.[a-zA-Z0-9_-]+$"

      superuserPasswordFrom:
        type: string
        pattern: "^secrets\\.[a-zA-Z0-9_-]+$"

      initDbEnv:
        type: object
        additionalProperties: true
        default: {}
        description: Additional environment variables to pass to the init-db script

      port:
        type: integer
        minimum: 1
        maximum: 65535
        default: 5432

      storage:
        type: object
        additionalProperties: false
        default: {}
        properties:
          enabled:
            type: boolean
            default: true
          size:
            type: string
            default: 5Gi

      initDbScript:
        type: string
        minLength: 1
        default: init-db.sql

      healthcheck:
        type: object
        additionalProperties: false
        default: {}
        properties:
          enabled:
            type: boolean
            default: true

      authentication:
        type: object
        additionalProperties: false
        default: {}
        description: >-
          Client authentication policy for the initial cluster (issue #206).
          hostAuth selects the pg_hba method applied to host (TCP)
          connections via initdb --auth-host; the local (unix socket) method
          stays password-based. Defaults to scram-sha-256, the modern
          password method; production validation rejects trust and warns on
          the legacy md5 method (E139, issue #206).
        properties:
          hostAuth:
            type: string
            enum:
              - scram-sha-256
              - md5
              - trust
            default: scram-sha-256

      backup:
        type: object
        additionalProperties: false
        default: {}
        description: >-
          Built-in backup and disaster-recovery capability (issue #665,
          docs/backup-restore.md): a pgBackRest sidecar service taking
          scheduled full and incremental backups plus continuous WAL
          archiving (point-in-time recovery) into an encrypted repository
          volume, with a gated one-shot restore service. Encryption is
          mandatory: enabling backup without a key fails validation (E141).
          Not yet implemented for the helm render target (E142).
        properties:
          enabled:
            type: boolean
            default: false
            description: >-
              Enables the postgres-backup sidecar, WAL archiving, and the
              postgres-backup-repo repository volume. Also advertises the
              backup-target contract this module provides.
          encryptionKeyFrom:
            type: string
            pattern: "^secrets\\.[a-zA-Z0-9_-]+$"
            description: >-
              Secret-alias reference to the client-side repository
              encryption key (aes-256-cbc). Required when enabled (E141);
              the alias must be declared required: true in production
              (E134 via spec.backup.encryption).
          incrementalIntervalMinutes:
            type: integer
            minimum: 5
            maximum: 1440
            default: 60
            description: >-
              Minutes between incremental backups. WAL is archived
              continuously, so the recovery point objective is the WAL
              archiving lag, not this interval.
          fullBackupIntervalHours:
            type: integer
            minimum: 1
            maximum: 168
            default: 24
            description: >-
              Hours between full backups (anchored to sidecar start; a
              sidecar restart begins with a fresh full backup).
          retentionDays:
            type: integer
            minimum: 1
            maximum: 3650
            default: 30
            description: >-
              Days a restore point (and its WAL) is retained in the
              repository; advertised as maxRetentionDays on the
              backup-target contract.

      dagsterDatabase:
        type: object
        additionalProperties: false
        default: {}
        properties:
          name:
            type: string
            minLength: 1
            default: dagster
          username:
            type: string
            minLength: 1
            default: dagster
          passwordFrom:
            type: string
            pattern: "^secrets\\.[a-zA-Z0-9_-]+$"

      supersetDatabase:
        type: object
        additionalProperties: false
        default: {}
        properties:
          name:
            type: string
            minLength: 1
            default: superset
          username:
            type: string
            minLength: 1
            default: superset
          passwordFrom:
            type: string
            pattern: "^secrets\\.[a-zA-Z0-9_-]+$"

      marquezDatabase:
        type: object
        additionalProperties: false
        default: {}
        properties:
          name:
            type: string
            minLength: 1
            default: marquez
          username:
            type: string
            minLength: 1
            default: marquez
          passwordFrom:
            type: string
            pattern: "^secrets\\.[a-zA-Z0-9_-]+$"

      dataProvider:
        type: object
        additionalProperties: false
        default: {}
        description: >
          Optional FDS (Federatief Datastelsel) data-provider metadata for
          a dataset held in this database, surfaced via the
          open-data-provider contract (see docs/fds-alignment.md, #773).
          Leave at defaults if this instance does not disclose data under
          the FDS Afsprakenstelsel.
        properties:
          datasetId:
            type: string
            default: ""
          title:
            type: string
            default: ""
          description:
            type: string
            default: ""
          classification:
            type: string
            default: ""
          accessConditions:
            type: string
            default: ""
          licence:
            type: string
            default: ""

  provides:
    - name: sql-database
      contract:
        kind: sql-database
        spec:
          host: ${service.host}
          port: ${config.port}
          database: ${config.database}
          username: ${config.username}
          password: ${config.passwordFrom}
          authentication: ${config.authentication.hostAuth}
          connectionUri: postgresql://${config.username}:${config.passwordFrom}@${service.host}:${config.port}/${config.database}

    - name: dagster-database
      contract:
        kind: sql-database
        spec:
          host: ${service.host}
          port: ${config.port}
          database: ${config.dagsterDatabase.name}
          username: ${config.dagsterDatabase.username}
          password: ${config.dagsterDatabase.passwordFrom}
          authentication: ${config.authentication.hostAuth}
          connectionUri: postgresql://${config.dagsterDatabase.username}:${config.dagsterDatabase.passwordFrom}@${service.host}:${config.port}/${config.dagsterDatabase.name}

    - name: superset-database
      contract:
        kind: sql-database
        spec:
          host: ${service.host}
          port: ${config.port}
          database: ${config.supersetDatabase.name}
          username: ${config.supersetDatabase.username}
          password: ${config.supersetDatabase.passwordFrom}
          authentication: ${config.authentication.hostAuth}
          connectionUri: postgresql://${config.supersetDatabase.username}:${config.supersetDatabase.passwordFrom}@${service.host}:${config.port}/${config.supersetDatabase.name}

    - name: marquez-database
      contract:
        kind: sql-database
        spec:
          host: ${service.host}
          port: ${config.port}
          database: ${config.marquezDatabase.name}
          username: ${config.marquezDatabase.username}
          password: ${config.marquezDatabase.passwordFrom}
          authentication: ${config.authentication.hostAuth}
          connectionUri: postgresql://${config.marquezDatabase.username}:${config.marquezDatabase.passwordFrom}@${service.host}:${config.port}/${config.marquezDatabase.name}

    - name: data-provider-metadata
      contract:
        kind: open-data-provider
        spec:
          datasetId: ${config.dataProvider.datasetId}
          title: ${config.dataProvider.title}
          description: ${config.dataProvider.description}
          classification: ${config.dataProvider.classification}
          accessConditions: ${config.dataProvider.accessConditions}
          licence: ${config.dataProvider.licence}

    - name: backup-target
      contract:
        kind: backup-target
        spec:
          endpoint: ${service.host}
          repository: postgres-backup-repo
          protocol: file
          encrypted: true
          maxRetentionDays: ${config.backup.retentionDays}
          supportsRestoreVerification: true
  implementation:
    kind: docker-compose
    targets:
      - docker-compose
      - kubernetes
    compose:
      services:
        # Learning/dev base variant: the pinned stock image, zero local
        # builds, so `cds up` on a learning profile only pulls. The
        # production-only pieces below replace these fields in production
        # profiles (production: mapping form; see apply_production_gates).
        postgres:
          image: postgres:18@sha256:32ca0af8e77bfb8c6610c488e4691f83f972a3e9e64d3b02facf3ab111ad5500
          user: postgres
          init: true
          read_only: true
          cap_drop:
            - ALL
          security_opt:
            - no-new-privileges:true
          pids_limit: 256
          tmpfs:
            - /tmp:rw,noexec,nosuid,nodev,uid=999,gid=999,mode=1777
            - /var/run/postgresql:rw,noexec,nosuid,nodev,uid=999,gid=999,mode=3775
          hostname: "${service.host}"
          ports:
            - "127.0.0.1:${config.port}:5432"
          environment:
            POSTGRES_PASSWORD: "${config.superuserPasswordFrom}"
            POSTGRES_INITDB_ARGS: -U postgres --auth-local=password --auth-host=${config.authentication.hostAuth}
            POSTGRES_DB: postgres
            POSTGRES_USER: postgres
          volumes:
            - type: bind
              source: "${config.initDbScript}"
              target: "/docker-entrypoint-initdb.d/${config.initDbScript}"
              read_only: true
            - postgres-data:/var/lib/postgresql
          healthcheck:
            conditionallyEnabledFrom: config.healthcheck.enabled
            test:
              - CMD-SHELL
              - pg_isready -U postgres
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s
          # Production pieces (issue #665): the hardened local build with
          # pgBackRest (continuous WAL archiving for the backup capability)
          # replaces the stock image; environment entries merge over the
          # base environment, and the volumes list is replaced wholesale so
          # it repeats the base mounts plus the backup repository.
          production:
            image: local/postgres:custom
            build:
              context: ../../../
              dockerfile: images/postgres/Dockerfile
            # archive_mode stays on in production; cds-pgbackrest-archive
            # (baked into images/postgres) pushes segments into the
            # pgBackRest repository only when the profile enables the
            # backup capability, and exits 0 otherwise so PostgreSQL
            # recycles WAL normally. The backup sidecar reaches this
            # cluster in pgBackRest local mode through the second unix
            # socket directory (the shared data volume's root,
            # version-independent); pgBackRest does not make TCP database
            # connections, and the scripts resolve PGDATA from the image's
            # environment.
            command:
              - postgres
              - -c
              - archive_mode=on
              - -c
              - archive_command=cds-pgbackrest-archive %p
              - -c
              - unix_socket_directories=/var/run/postgresql,/var/lib/postgresql
            environment:
              CDS_BACKUP_ENABLED: "${config.backup.enabled}"
              PGBACKREST_STANZA: cds
              PGBACKREST_LOG_PATH: /tmp
              PGBACKREST_REPO1_PATH: /var/lib/pgbackrest
              PGBACKREST_REPO1_CIPHER_TYPE: aes-256-cbc
              PGBACKREST_REPO1_CIPHER_PASS: "${ifNonempty:config.backup.encryptionKeyFrom,,}"
              PGBACKREST_REPO1_RETENTION_FULL: "${config.backup.retentionDays}"
              PGBACKREST_REPO1_RETENTION_FULL_TYPE: time
            volumes:
              - type: bind
                source: "${config.initDbScript}"
                target: "/docker-entrypoint-initdb.d/${config.initDbScript}"
                read_only: true
              - postgres-data:/var/lib/postgresql
              - type: volume
                source: postgres-backup-repo
                target: /var/lib/pgbackrest
                enabledFrom: config.backup.enabled

        # Backup sidecar (issue #665): pgBackRest full/incremental backups
        # plus `check` integrity verification on a schedule; WAL archiving
        # runs in the postgres service. Production-only piece; reads the
        # data directory read-only, restores go through the gated
        # postgres-restore service.
        postgres-backup:
          production: true
          enabledFrom: config.backup.enabled
          image: local/postgres:custom
          user: postgres
          init: true
          read_only: true
          cap_drop:
            - ALL
          security_opt:
            - no-new-privileges:true
          pids_limit: 128
          tmpfs:
            - /tmp:rw,noexec,nosuid,nodev,uid=999,gid=999,mode=1777
          depends_on:
            postgres:
              condition: service_healthy
          entrypoint:
            - cds-backup-scheduler
          environment:
            PGBACKREST_STANZA: cds
            PGBACKREST_LOG_PATH: /tmp
            PGBACKREST_REPO1_PATH: /var/lib/pgbackrest
            PGBACKREST_REPO1_CIPHER_TYPE: aes-256-cbc
            PGBACKREST_REPO1_CIPHER_PASS: "${ifNonempty:config.backup.encryptionKeyFrom,,}"
            PGBACKREST_REPO1_RETENTION_FULL: "${config.backup.retentionDays}"
            PGBACKREST_REPO1_RETENTION_FULL_TYPE: time
            # The cluster uses --auth-local=password, so even socket
            # connections authenticate; pgBackRest picks this up via libpq.
            PGPASSWORD: "${config.superuserPasswordFrom}"
            CDS_BACKUP_INCREMENTAL_MINUTES: "${config.backup.incrementalIntervalMinutes}"
            CDS_BACKUP_FULL_HOURS: "${config.backup.fullBackupIntervalHours}"
          volumes:
            - type: volume
              source: postgres-data
              target: /var/lib/postgresql
              read_only: true
            - type: volume
              source: postgres-backup-repo
              target: /var/lib/pgbackrest
          healthcheck:
            disable: true

        # One-shot restore service (issue #665). Inactive unless the
        # cds-restore profile is activated, so `docker compose up` never
        # starts it; run it with its default command, e.g.
        #   docker compose stop postgres
        #   docker compose --profile cds-restore run --rm postgres-restore
        #   docker compose start postgres
        # Extra arguments replace the default command wholesale, so repeat
        # the --recovery-option flags when overriding (see below).
        # See docs/backup-restore.md for the full procedure and the clean
        # environment used for restore verification. Production-only piece.
        postgres-restore:
          production: true
          enabledFrom: config.backup.enabled
          profiles:
            - cds-restore
          image: local/postgres:custom
          user: postgres
          init: true
          read_only: true
          cap_drop:
            - ALL
          security_opt:
            - no-new-privileges:true
          pids_limit: 128
          tmpfs:
            - /tmp:rw,noexec,nosuid,nodev,uid=999,gid=999,mode=1777
          restart: "no"
          entrypoint:
            - cds-restore
          # --recovery-option makes pgBackRest write the recovery settings
          # itself: archive_mode on, recovery.signal, and a restore_command
          # pointing at the cds-pgbackrest-get wrapper (which resolves the
          # data directory from the image's PGDATA at recovery time). The
          # restored cluster replays WAL from the encrypted repository up
          # to the latest archived segment.
          command:
            - --stanza=cds
            - --delta
            - --recovery-option=archive_mode=on
            - --recovery-option=restore_command=cds-pgbackrest-get %f "%p"
            - restore
          environment:
            PGBACKREST_STANZA: cds
            PGBACKREST_LOG_PATH: /tmp
            PGBACKREST_REPO1_PATH: /var/lib/pgbackrest
            PGBACKREST_REPO1_CIPHER_TYPE: aes-256-cbc
            PGBACKREST_REPO1_CIPHER_PASS: "${ifNonempty:config.backup.encryptionKeyFrom,,}"
          volumes:
            - type: volume
              source: postgres-data
              target: /var/lib/postgresql
            - type: volume
              source: postgres-backup-repo
              target: /var/lib/pgbackrest
              read_only: true
          healthcheck:
            disable: true

      volumes:
        postgres-data:
          enabledFrom: config.storage.enabled
        # Production-only repository volume for the pgBackRest backups.
        postgres-backup-repo:
          production: true
          enabledFrom: config.backup.enabled


    kubernetes:
      workloads:
        postgres:
          kind: StatefulSet
          # compose `user: postgres`; the image creates postgres as uid/gid 999.
          # fsGroup makes the PVC group-writable so postgres can open its data dir.
          podSecurityContext:
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
            fsGroup: 999
          containers:
            - postgres
          service:
            type: ClusterIP
            ports:
              - name: postgres
                port: 5432
                targetPort: 5432
          resources:
            postgres:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
      volumes:
        postgres-data:
          type: persistentVolumeClaim
          sizeFrom: config.storage.size
          accessModes:
            - ReadWriteOnce
          enabledFrom: config.storage.enabled
      configMaps:
        init-db:
          key: "${config.initDbScript}"
          fromBind: "${config.initDbScript}"
          mode: "0555"
