# modules/identity/keycloak/module.yaml
# yaml-language-server: $schema=../../../cli/resources/module.schema.json
apiVersion: cds/v1alpha1
kind: Module
metadata:
  name: keycloak
  category: identity
  version: 0.1.0
  displayName: Keycloak
  description: 'TODO: describe keycloak. Auto-generated by scripts/compose_to_module.py
    from compose service(s) keycloak; review before use.'
spec:
  runtime:
    type: container
    service:
      name: keycloak
      ports:
      - name: http
        containerPort: 8080
        protocol: TCP
  configSchema:
    type: object
    additionalProperties: false
    properties:
      httpPort:
        type: integer
        minimum: 1
        maximum: 65535
        default: 8080
        description: Host port published for keycloak's container port 8080.
      kcDb:
        type: string
        default: postgres
        description: Value for keycloak's KC_DB environment variable.
      kcDbUsername:
        type: string
        default: keycloak
        description: Value for keycloak's KC_DB_USERNAME environment variable.
      kcDbPassword:
        type: string
        default: keycloak_password
        description: Value for keycloak's KC_DB_PASSWORD environment variable.
      keycloakAdmin:
        type: string
        default: admin
        description: Value for keycloak's KEYCLOAK_ADMIN environment variable.
      keycloakAdminPassword:
        type: string
        default: admin_password
        description: Value for keycloak's KEYCLOAK_ADMIN_PASSWORD environment variable.
  consumes: []
  provides: []
  implementation:
    kind: docker-compose
    compose:
      services:
        keycloak:
          image: keycloak/keycloak:latest
          container_name: keycloak
          depends_on:
            postgres:
              condition: service_healthy
          command:
          - start-dev
          ports:
          - ${config.httpPort}:8080
          environment:
            KC_DB: ${config.kcDb}
            KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
            KC_DB_USERNAME: ${config.kcDbUsername}
            KC_DB_PASSWORD: ${config.kcDbPassword}
            KEYCLOAK_ADMIN: ${config.keycloakAdmin}
            KEYCLOAK_ADMIN_PASSWORD: ${config.keycloakAdminPassword}
