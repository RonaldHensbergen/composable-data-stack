# modules/identity/keycloak/module.yaml
# yaml-language-server: $schema=../../../cli/resources/module.schema.json
apiVersion: cds/v1alpha1
kind: Module
metadata:
  name: keycloak
  category: identity
  version: 0.1.0
  displayName: Keycloak
  description: >
    Keycloak identity/SSO provider with production web serving by default,
    backed by a consumed sql-database contract for its own metadata store.
spec:
  # Contract hosts are built from ${service.dns} (#1028), which requires
  # cds >= 0.15.0; older CLIs fail at validate/plan time with E024.
  requiresCliVersion: "0.15.0"
  runtime:
    type: container
    service:
      name: keycloak
      ports:
        - name: http
          containerPort: 8080
          protocol: TCP
  configSchema:
    type: object
    additionalProperties: false
    required:
      - metadataDatabase
      - adminUser
    properties:
      httpPort:
        type: integer
        minimum: 1
        maximum: 65535
        default: 8080
        description: >
          Host port published for keycloak's container port. Bound to
          127.0.0.1 (localhost-only), matching modules/warehouse/postgres;
          the admin console is reachable from the local machine only. Use
          an SSH tunnel, port-forward, or a reverse-proxy/ingress module
          for access beyond localhost. This is only the host-side publish:
          in-network consumers (e.g. a reverse proxy generating routes from
          the http-service contract, issue #883) dial containerPort.
      containerPort:
        type: integer
        minimum: 1
        maximum: 65535
        default: 8080
        description: >
          TCP port the Keycloak container listens on inside the Compose
          network (mirrors runtime.service.ports[].containerPort). The
          http-service contract advertises this port as the backend port,
          because a reverse proxy reaches the container on the shared
          network, where the localhost-only httpPort publish does not
          apply; the two may differ (the reference profile publishes
          8081 on the host while the container stays on 8080).
      webServer:
        type: object
        additionalProperties: false
        default: {}
        properties:
          mode:
            type: string
            enum:
              - production
              - development
            default: production
            description: >
              Web serving mode (issue #216). \"production\" (default) starts
              Keycloak in production mode (`kc.sh start --http-enabled=true`),
              keeping the localhost-only HTTP bind for the
              reverse-proxy/ingress in front of it. \"development\" starts
              Keycloak in development mode (`start-dev`), which relaxes
              hostname and TLS requirements; intended for local development
              only and rejected by validation in production profiles (E140).
              The default is \"production\" (issue #974) so a production
              profile without an explicit mode can never silently run
              `start-dev`.
      realm:
        type: string
        pattern: "^[A-Za-z0-9._-]+$"
        default: master
        description: >-
          Realm advertised through the oidc-provider contract. Non-master
          realms are imported on startup if they do not already exist.
      publicUrl:
        type: string
        pattern: "^https?://[^/\\s?#]+(?:/[^\\s?#]+)*$"
        default: "http://localhost:8080"
        description: >-
          Canonical externally reachable Keycloak base URL without a trailing
          slash. It must resolve from both the user's browser and consuming
          service containers; set it to the TLS reverse-proxy URL in deployed
          profiles.
      oidcClients:
        type: array
        default: []
        description: >-
          Optional OIDC clients provisioned into the imported (non-master)
          realm on startup (issue #1074), so consumers such as Superset need
          no manual admin-console work. CDS renders the realm-import JSON
          from this list and injects it as the CDS_OIDC_REALM_IMPORT
          environment variable; client secrets stay profile secret-alias
          references and render as ${CDS_*} runtime placeholders, never
          embedded in the rendered Compose output. The built-in master realm
          is never imported, so clients are only provisioned for a dedicated
          realm.
        items:
          type: object
          additionalProperties: false
          required:
            - clientId
            - redirectUris
          properties:
            clientId:
              type: string
              minLength: 1
              pattern: "^[A-Za-z0-9._-]+$"
              description: OIDC client id, e.g. "superset".
            redirectUris:
              type: array
              minItems: 1
              items:
                type: string
                minLength: 1
              description: >-
                Exact callback URLs registered for this client, e.g.
                "${publicUrl}/oauth-authorized/keycloak" for a Superset
                consumer fronted by a reverse proxy.
            webOrigins:
              type: array
              default: []
              items:
                type: string
                minLength: 1
              description: Allowed CORS web origins; empty disables CORS.
            standardFlowEnabled:
              type: boolean
              default: true
              description: Enable the OIDC Authorization Code flow.
            roles:
              type: array
              default: []
              items:
                type: string
                minLength: 1
                pattern: "^[A-Za-z0-9._-]+$"
              description: >-
                Realm roles created (if absent) and assigned to this client
                as default roles.
            secretFrom:
              type: string
              pattern: "^secrets\\.[a-zA-Z0-9_-]+$"
              description: >-
                Profile secret alias holding the client secret. When set, the
                client is confidential and the secret is provisioned from the
                CDS_* environment placeholder at container start; when absent,
                the client is public.
      metadataDatabase:
        type: object
        additionalProperties: false
        required:
          - contractRef
        properties:
          contractRef:
            type: string
            pattern: "^[a-z0-9-]+\\.[a-z0-9-]+$"
            description: "Reference to a sql-database binding (e.g., postgres.identity-database)"
          driver:
            type: string
            enum:
              - postgres
              - mysql
              - mariadb
              - mssql
              - oracle
            default: postgres
            description: >
              Keycloak KC_DB vendor value matching the wire protocol spoken
              by the bound sql-database provider. Defaults to postgres, the
              only sql-database provider in this repository today. Because
              the metadata-database consume entry declares engineFrom for
              this field, the bound provider's contract must advertise a
              matching "engine" (issue #682); a mismatch or a provider with
              no engine advertisement fails validation with E154.
      adminUser:
        type: object
        additionalProperties: false
        required:
          - username
          - passwordFrom
        properties:
          username:
            type: string
            minLength: 1
          passwordFrom:
            type: string
            pattern: "^secrets\\.[a-zA-Z0-9_-]+$"
      healthcheck:
        type: object
        additionalProperties: false
        default: {}
        properties:
          enabled:
            type: boolean
            default: true
  consumes:
    - name: metadata-database
      contract:
        kind: sql-database
      required: true
      mappedFrom: spec.config.metadataDatabase
      # Enforces that the bound provider actually speaks the engine named by
      # spec.config.metadataDatabase.driver (issue #682): the provider's
      # sql-database contract must advertise a matching "engine" in its spec,
      # otherwise validation fails with E154 instead of letting Keycloak
      # speak the wrong wire protocol to the bound database.
      engineFrom: spec.config.metadataDatabase.driver
  provides:
    - name: http-service
      contract:
        kind: http-service
        spec:
          portFrom: spec.config.containerPort
          host: ${service.dns}
          # The backend port is the in-network container port, not the
          # localhost host publish (httpPort): a reverse proxy generating
          # routes from this contract (issue #883) dials the container on
          # the shared Compose network, where httpPort does not apply.
          port: ${config.containerPort}
          protocol: http
    - name: oidc-provider
      contract:
        kind: oidc-provider
        spec:
          issuerUrl: "${config.publicUrl}/realms/${config.realm}"
          realm: ${config.realm}
  implementation:
    kind: docker-compose
    compose:
      services:
        keycloak:
          image: quay.io/keycloak/keycloak:26.8.0@sha256:82a77884f3af238beab1e7afd63b5f530e1b5c0590bd7aa60b40a40463e29b2c
          user: "1000:0"
          init: true
          read_only: true
          cap_drop:
            - ALL
          security_opt:
            - no-new-privileges:true
          tmpfs:
            - /tmp:rw,noexec,nosuid,nodev,mode=1777
            - /opt/keycloak/data:rw,noexec,nosuid,nodev,uid=1000,gid=0,mode=0700
          volumes:
            - keycloak-quarkus:/opt/keycloak/lib/quarkus
          command: []
          # CDS's renderer only processes ${...} expressions, so the $$ escape
          # below reaches Docker Compose untouched and Compose hands a literal
          # ${CDS_WEBSERVER_MODE:-production} to /bin/bash in the container.
          # Without the escape Compose interpolates the placeholder itself at
          # up time from the *host* environment (defaulting it to "production"
          # there) and the rendered CDS_WEBSERVER_MODE environment entry below
          # would never be consulted (keydb uses the same escape).
          entrypoint:
            - /bin/bash
            - -ec
            - |
              REALM="$${CDS_KEYCLOAK_REALM:-master}"
              if [ "$$REALM" != "master" ]; then
                  mkdir -p /opt/keycloak/data/import
                  # CDS_OIDC_REALM_IMPORT is injected by the CDS renderer from
                  # config.realm + config.oidcClients (issue #1074). Client
                  # secrets inside it are ${CDS_*} placeholders in the
                  # rendered Compose file, interpolated by Compose at up time,
                  # so the import file on the tmpfs holds the real value while
                  # the rendered output never does.
                  IMPORT_JSON="$${CDS_OIDC_REALM_IMPORT:-}"
                  if [ -z "$$IMPORT_JSON" ]; then
                      IMPORT_JSON="{\"realm\":\"$$REALM\",\"enabled\":true}"
                  fi
                  printf '%s' "$$IMPORT_JSON" > "/opt/keycloak/data/import/$$REALM-realm.json"
                  IMPORT_REALM="--import-realm"
              else
                  IMPORT_REALM=""
              fi
              if [ "$${CDS_WEBSERVER_MODE:-production}" = "development" ]; then
                  exec /opt/keycloak/bin/kc.sh start-dev $$IMPORT_REALM
              fi
              # Plain HTTP on the localhost-only bind for the TLS-terminating
              # reverse proxy in front (docs/serving-modes.md). Keycloak's
              # production mode refuses to start without a hostname
              # ("hostname is not configured") until KC hostname/proxy-header
              # configuration lands with the reverse-proxy contract work
              # (#579/#581), so hostname-strict stays relaxed here.
              exec /opt/keycloak/bin/kc.sh start --http-enabled=true --hostname-strict=false $$IMPORT_REALM
          ports:
            - "127.0.0.1:${config.httpPort}:${config.containerPort}"
          environment:
            KC_DB: "${config.metadataDatabase.driver}"
            KC_DB_URL_HOST: "${bindings.metadata-database.host}"
            KC_DB_URL_PORT: "${bindings.metadata-database.port}"
            KC_DB_URL_DATABASE: "${bindings.metadata-database.database}"
            KC_DB_USERNAME: "${bindings.metadata-database.username}"
            KC_DB_PASSWORD: "${bindings.metadata-database.password}"
            KC_BOOTSTRAP_ADMIN_USERNAME: "${config.adminUser.username}"
            KC_BOOTSTRAP_ADMIN_PASSWORD: "${config.adminUser.passwordFrom}"
            KC_HEALTH_ENABLED: "true"
            CDS_WEBSERVER_MODE: "${config.webServer.mode}"
            CDS_KEYCLOAK_REALM: "${config.realm}"
          healthcheck:
            conditionallyEnabledFrom: config.healthcheck.enabled
            test:
              - CMD-SHELL
              - >-
                bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000;
                echo -e "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
                cat <&3 | grep -q "200 OK"'
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 60s

      volumes:
        keycloak-quarkus: {}
