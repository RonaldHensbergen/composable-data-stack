# pyproject.toml for the cds-runtime workload API (issue #219).
#
# Deliberately dependency-free at the core: SQLAlchemy and the database
# drivers are optional extras imported lazily, so a workload image can
# install only what its connections need.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cds-runtime"
version = "0.1.0"
description = "Runtime API for CDS workloads: named database connections resolved from CDS contracts"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Ronald Hensbergen" },
]
keywords = [
  "data-platform",
  "data-stack",
  "database",
  "sqlalchemy",
]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Database",
]

[project.optional-dependencies]
sqlalchemy = ["sqlalchemy>=2.0"]
postgresql = ["sqlalchemy>=2.0", "psycopg2-binary>=2.9"]
mysql = ["sqlalchemy>=2.0", "pymysql>=1.1"]

[project.urls]
Homepage = "https://github.com/RonaldHensbergen/composable-data-stack"
Documentation = "https://github.com/RonaldHensbergen/composable-data-stack/blob/main/docs/runtime-api.md"
Issues = "https://github.com/RonaldHensbergen/composable-data-stack/issues"
Repository = "https://github.com/RonaldHensbergen/composable-data-stack"

[tool.setuptools]
packages = ["cds_runtime", "cds_runtime.adapters"]

[tool.setuptools.package-data]
cds_runtime = ["py.typed"]

# Ruff discovers this file first for runtime/, so the package is linted at
# its own Python floor (>=3.10) rather than the CLI's >=3.14, keeping UP
# suggestions valid for every consumer of the wheel. The rule selection
# mirrors the root pyproject.toml; keep both in sync.
[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["UP", "F", "B", "S", "I"]
