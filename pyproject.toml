# pyproject.toml
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "composable-data-stack"
version = "0.6.1"
description = "CLI for validating and composing composable data stack profiles"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Ronald Hensbergen" },
]
keywords = [
  "data-platform",
  "data-stack",
  "docker-compose",
  "infrastructure-as-code",
]
requires-python = ">=3.14"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Build Tools",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.22.0",
  "jinja2>=3.0",
  "packaging>=23.0",
  "rich>=15.0",
]

[project.urls]
Homepage = "https://github.com/RonaldHensbergen/composable-data-stack"
Documentation = "https://github.com/RonaldHensbergen/composable-data-stack/tree/main/docs"
Issues = "https://github.com/RonaldHensbergen/composable-data-stack/issues"
Repository = "https://github.com/RonaldHensbergen/composable-data-stack"

[project.optional-dependencies]
completion = [
  "argcomplete>=3.0.0,<4",
]
dev = [
  "coverage>=7.6",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "ruff==0.16.4",
]

[project.scripts]
cds = "cli.main:main"

[tool.setuptools]
packages = ["cli", "cli.resources"]

[tool.setuptools.package-data]
"cli.resources" = ["*.json"]

[tool.coverage.run]
source = ["cli"]

[tool.coverage.report]
fail_under = 65
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# Expanded beyond pyupgrade: F (pyflakes), B (bugbear), S (bandit security),
# I (isort). Flake8 pre-commit hook retained as a secondary gate during the
# transition, but Ruff now covers the same surface.
select = ["UP", "F", "B", "S", "I"]

[tool.ruff.lint.per-file-ignores]
# Bandit's CI job already scopes its scan to cli/, shared/, images/, and
# workdirs/ (see .github/workflows/ci.yml), deliberately excluding tests/.
# Mirror that boundary here: test code legitimately uses assert (S101),
# invokes trusted CLI tools like docker/git with static argument lists
# (S603/S607), asserts on hardcoded tmp paths/permissions used only in
# fixtures and rendered-output checks (S103/S108), and opens local/loopback
# URLs to poll test fixtures (S310).
"tests/*" = ["S101", "S103", "S108", "S310", "S603", "S607"]

